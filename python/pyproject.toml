[project]
name = "worldsim"
version = "0.2.0"
description = "Python-инструменты worldsim: среды, данные и квалификация world models по законам физики"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
license = { text = "MIT" }

[project.optional-dependencies]
baseline = ["torch>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["worldsim"]
