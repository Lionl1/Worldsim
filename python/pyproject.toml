[project]
name = "worldsim"
version = "0.3.3"
description = "worldsim Python tools: environments, data and world model qualification against physical laws"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
license = { text = "MIT" }

[project.optional-dependencies]
baseline = ["torch>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["worldsim"]
