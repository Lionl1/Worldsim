<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>worldsim — модель вселенной</title>
<style>
:root{--bg:#0a0e15;--side:#10151f;--panel:#131925;--raised:#1a2230;--line:#2a3445;--hair:#222b3a;--field:#3a475c;--field-h:#52617a;--track:#232c3b;--axis:#7c8aa3;--code:#d8e4f7;--text:#edf1f7;--soft:#c5cedc;--muted:#a3aec1;--accent:#5aa2ff;--accent-strong:#2f6fed;--good:#4ade80;--bad:#ff7b7b;--warn:#fbbf4b;--good-bg:#123a26;--bad-bg:#451c20;--warn-bg:#40310f;--panel-w:384px;--chart-h:216px}
:root[data-theme=light]{--bg:#f4f6f9;--side:#ffffff;--panel:#ffffff;--raised:#eef1f6;--line:#d5dbe5;--hair:#e3e7ee;--field:#b6c0cf;--field-h:#8b98ab;--track:#dfe4ec;--axis:#6b7789;--code:#1c2b45;--text:#141a24;--soft:#35404f;--muted:#566173;--accent:#1f66e0;--accent-strong:#1f66e0;--good:#0f7a3d;--bad:#c62f3a;--warn:#8f5e00;--good-bg:#dcf5e6;--bad-bg:#fbe2e4;--warn-bg:#fbeecb}
.no-motion *,.no-motion *::before,.no-motion *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}.no-chart #chartbox:not(main.plot #chartbox){display:none!important}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:216px minmax(0,1fr);height:100%}
/* меню */
nav{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px;gap:2px;overflow:auto}
nav h1{font-size:18px;font-weight:700;margin:0 8px;letter-spacing:-.2px}nav .sub{color:var(--muted);font-size:13px;margin:2px 8px 10px;line-height:1.35}
nav .grp{color:var(--muted);font-size:12px;font-weight:600;margin:14px 8px 4px}
nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;color:var(--soft);font-size:14px;transition:background .15s,color .15s}
nav button:hover{background:var(--raised);color:var(--text)}nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
nav button.on{background:var(--accent-strong);color:#fff;font-weight:600}
nav .foot{margin-top:auto;padding:14px 8px 2px;color:var(--muted);font-size:12px;line-height:1.45}
/* единая раскладка: сцена в центре, график под ней, управление справа */
main{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);grid-template-rows:auto minmax(0,1fr) auto}
#hud{grid-column:1;grid-row:1;background:var(--side);border-bottom:1px solid var(--line);padding:9px 16px;color:var(--soft);font-variant-numeric:tabular-nums;font-size:14px}.hud b{color:var(--text);font-weight:600}.hud .k{color:var(--muted)}
#stage{grid-column:1;grid-row:2;position:relative;min-height:0;min-width:0;background:#05070c}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .25s}
#bh{position:absolute;inset:0;width:100%;height:100%;display:none;background:#000;z-index:1;object-fit:contain}
main.plot #stage{display:none}main.plot #chartbox{grid-row:1/4;height:auto;display:block!important;padding:18px}
#chartbox{grid-column:1;grid-row:3;height:var(--chart-h);background:var(--side);border-top:1px solid var(--line);padding:8px 10px}#chart{width:100%;height:100%;display:block}
#panel{grid-column:2;grid-row:1/4;background:var(--panel);border-left:1px solid var(--line);padding:18px;overflow:auto;min-height:0}
.panel h2{margin:0 0 6px;font-size:18px;font-weight:650;letter-spacing:-.2px;line-height:1.3}.panel>.muted:first-of-type{margin-bottom:12px}
h3{margin:20px 0 8px;font-size:13px;font-weight:650;color:var(--text);padding-top:14px;border-top:1px solid var(--line);text-transform:none;letter-spacing:0}
.panel h2+h3{border-top:0}
.muted{color:var(--muted)}.ok{color:var(--good)}.no{color:var(--bad)}
/* поля */
.row{display:flex;gap:10px;align-items:center;margin:8px 0}.row label{flex:0 0 128px;color:var(--soft);font-size:14px;line-height:1.25}.row>*:last-child{flex:1;min-width:0}
select,input[type=number],input[type=text],textarea{background:var(--bg);color:var(--text);border:1px solid var(--field);border-radius:6px;padding:7px 9px;width:100%;font:inherit;transition:border-color .15s,box-shadow .15s}
select:hover,input:hover,textarea:hover{border-color:var(--field-h)}select:focus,input:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(90,162,255,.25)}
input[type=range]{width:100%;accent-color:var(--accent);height:20px}
.btn{all:unset;cursor:pointer;background:var(--accent-strong);color:#fff;padding:8px 14px;border-radius:6px;text-align:center;font-weight:600;transition:background .15s}.btn:hover{background:#4383f7}.btn:focus-visible{outline:2px solid #fff;outline-offset:1px}
.btn.sec{background:var(--raised);color:var(--text);font-weight:500;box-shadow:inset 0 0 0 1px var(--field)}.btn.sec:hover{background:var(--track)}.btn.off{opacity:.5;pointer-events:none}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* таблицы */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0}.kv>div{padding:5px 0;border-bottom:1px solid var(--hair)}.kv div:nth-child(odd){color:var(--soft);padding-right:12px}.kv div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:4px;font-size:13px;font-weight:600;background:var(--raised);color:var(--soft);white-space:nowrap}.pill.g{background:var(--good-bg);color:var(--good)}.pill.r{background:var(--bad-bg);color:var(--bad)}.pill.y{background:var(--warn-bg);color:var(--warn)}
.bar{height:8px;border-radius:2px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--soft)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.cam{width:100%;image-rendering:pixelated;border-radius:4px;background:#000;display:block}
/* законы */
#settings{position:absolute;inset:0;overflow:auto;padding:28px 36px;display:none;background:var(--bg);z-index:3}
.pg{border-top:1px solid var(--line)}.pg summary{cursor:pointer;padding:9px 0;font-weight:600;list-style-position:inside}.pg .row{margin:6px 0}.badge{display:inline-block;min-width:18px;text-align:center;border-radius:9px;background:var(--accent-strong);color:#fff;font-size:12px;padding:0 5px}.badge:empty{display:none}
.tabs2{display:flex;gap:6px;margin:12px 0 4px}.tabs2 .btn{flex:1}.item{padding:9px 0;border-bottom:1px solid var(--hair)}.item input[type=text]{margin-bottom:6px}.item .row{margin:6px 0 0}.item1{margin:6px 0}.del{padding:5px 9px;flex:0 0 auto!important}.pset{display:flex;gap:6px;margin:8px 0}.pset select{flex:1;min-width:0}
input:invalid{border-color:var(--bad)}
#laws{position:absolute;inset:0;overflow:auto;padding:26px 32px;display:none;background:var(--bg);z-index:3}#laws h2{font-size:22px;margin:0 0 14px}#laws table{max-width:1200px}#laws td{font-size:14px}
#tip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--line);padding:6px 8px;border-radius:4px;display:none}
#veil{position:absolute;inset:0;pointer-events:none;opacity:0;background:var(--bg);transition:opacity .16s ease;z-index:6}#veil.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fade{from{opacity:0}to{opacity:1}}.panel.enter>*{animation:fade .25s ease both}
#busy{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--line);padding:7px 14px;border-radius:6px;opacity:0;visibility:hidden;transition:opacity .15s;z-index:8}#busy.on{opacity:1;visibility:visible}#busy::before{content:"";width:13px;height:13px;border-radius:50%;border:2px solid #4a5870;border-top-color:var(--accent);animation:spin .7s linear infinite}
/* Mission Lab: отчёт как одна страница */
#mission{position:absolute;inset:0;overflow:auto;display:none;background:var(--bg);padding:28px 36px 40px;z-index:2}.report{max-width:940px;margin:0 auto;animation:fade .3s ease both}
.report h2{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}.report h3{font-size:16px;margin:30px 0 10px;padding:0;border:0}.report td{font-size:14px}.report .sub{color:var(--muted);margin-bottom:18px}
.ml-empty{max-width:520px;margin:18vh auto 0;text-align:center;color:var(--soft)}.ml-empty b{display:block;font-size:20px;margin-bottom:8px;color:var(--text)}
.verdict{display:flex;gap:28px;align-items:center;flex-wrap:wrap;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.verdict .num{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}.verdict .txt{flex:1;min-width:240px}.advice{margin-top:14px;font-size:15px;color:var(--text);line-height:1.5}
.hbar{display:grid;grid-template-columns:minmax(150px,34%) 1fr 62px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--hair)}.hbar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}.hbar .bar{height:10px}.bar i.red,.tor i.red{background:var(--bad)}
.tor{position:relative;height:10px;background:var(--track);border-radius:2px;overflow:hidden}.tor::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--axis)}.tor i{position:absolute;top:0;bottom:0;display:block}.tor i.grn{background:var(--good)}.tor u{position:absolute;top:4px;height:2px;background:var(--text);z-index:1;opacity:.75}.tor.ci{margin:5px 0 4px}tr.dim td{color:var(--muted)}.ml-foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.hrun{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}.hrun label{color:var(--text);display:flex;gap:6px;align-items:baseline}.hrun .muted{grid-column:1;font-size:13px}.hrun .btn{grid-column:2;grid-row:1/3;padding:4px 10px}
#ml_s{height:460px;min-height:240px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--code);resize:vertical}#ml_err{margin-top:8px}
@media (max-width:1100px){main{grid-template-columns:minmax(0,1fr) 320px}.row label{flex-basis:108px}}
@media (max-width:760px){#app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}nav{flex-direction:row;padding:6px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:2px;scrollbar-width:none}nav h1,nav .sub,nav .foot,nav .grp{display:none}nav button{white-space:nowrap;flex:0 0 auto}
main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 40vh minmax(0,1fr)}main.plot #chartbox{display:block!important;grid-column:1;grid-row:1/3;height:auto;padding:8px}#hud{grid-row:1;padding:6px 10px;font-size:13px}#stage{grid-row:2}#chartbox{display:none}#panel{grid-column:1;grid-row:3;border-left:0;border-top:1px solid var(--line);padding:14px}#laws{padding:14px}#laws table{min-width:640px}#mission{padding:14px}.hbar{grid-template-columns:minmax(110px,40%) 1fr 54px}#ml_s{height:240px}.report{overflow-x:auto}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<div id="app">
<nav>
  <h1>worldsim</h1><div class="sub">физика для миссий и world models</div>
  <div class="grp">Инженерия</div>
  <button data-tab="mission">Mission Lab</button>
  <button data-tab="robots">Роботы</button>
  <button data-tab="laws">Законы</button>
  <div class="grp">Вселенная</div>
  <button data-tab="world">Миры</button>
  <button data-tab="climate">Климат</button>
  <button data-tab="solar">Солнечная система</button>
  <button data-tab="system">Звёздные системы</button>
  <button data-tab="starmap">Карта звёзд и экзопланет</button>
  <button data-tab="galaxy">Галактики</button>
  <button data-tab="cosmo">Космология</button>
  <div class="grp">Физика</div>
  <button data-tab="blackhole">Чёрные дыры</button>
  <button data-tab="lab">Лаборатория</button>
  <div class="grp">Прочее</div>
  <button data-tab="settings">Настройки</button>
  <div class="foot">Данные: HYG v4.1 (CC BY-SA 4.0), Open Exoplanet Catalogue (MIT), Planck 2018, NASA Fact Sheets.<br>Мышь: вращение, колесо — масштаб.</div>
</nav>
<main>
  <div id="hud" class="hud" style="display:none"></div>
  <div id="stage"><canvas id="gl"></canvas><canvas id="bh"></canvas><div id="mission"></div></div>
  <div id="panel" class="panel"></div>
  <div id="chartbox" class="chartbox" style="display:none"><canvas id="chart"></canvas></div>
  <div id="laws"></div>
  <div id="settings"></div>
  <div id="veil"></div>
  <div id="tip"></div>
  <div id="busy"><span id="busy_t">считаю…</span></div>
</main>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================ инфраструктура
const $ = s => document.querySelector(s);
const canvas = $('#gl'), panel = $('#panel'), hud = $('#hud'), chartbox = $('#chartbox'), chartEl = $('#chart'), tip = $('#tip');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
let current = null, epoch = 0;
/* токен живёт только до закрытия вкладки и передаётся заголовком, а не в адресе */
const authToken = () => { try { return sessionStorage.getItem('ws_token') || ''; } catch(e){ return ''; } };
const api = async (path, opts={}) => {
  const headers = {...(opts.headers||{})}, t = authToken(); if (t) headers.Authorization = 'Bearer '+t;
  let r = await fetch(path, {...opts, headers});
  if (r.status === 401){
    const v = prompt('Сервер защищён. Введите токен доступа:');
    if (v){ try { sessionStorage.setItem('ws_token', v); } catch(e){} headers.Authorization = 'Bearer '+v; r = await fetch(path, {...opts, headers}); }
  }
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).error } catch(e){} throw new Error(m); }
  return opts.binary ? r : r.json();
};
const qs = o => new URLSearchParams(Object.entries(o).filter(([k,v]) => v !== undefined && v !== null && v !== '')).toString();
const busy = (on, text='считаю…') => { $('#busy_t').textContent = text; $('#busy').classList.toggle('on', !!on); };
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
/* время в подходящих единицах: млрд лет … лет */
const fmtTime = g => { const a=Math.abs(g); return a>=1 ? g.toFixed(3)+' млрд лет' : a>=1e-3 ? (g*1e3).toFixed(2)+' млн лет' : a>=1e-6 ? (g*1e6).toFixed(1)+' тыс. лет' : (g*1e9).toFixed(0)+' лет'; };
const fmt = (x, d=2) => x == null || !isFinite(x) ? '—' : (Math.abs(x) >= 1e5 || (Math.abs(x) < 1e-3 && x !== 0)) ? x.toExponential(d) : x.toFixed(d);
function resize(){ const m = canvas.parentElement; renderer.setSize(m.clientWidth, m.clientHeight, false); if (current?.camera){ current.camera.aspect = m.clientWidth/m.clientHeight; current.camera.updateProjectionMatrix(); } }
addEventListener('resize', resize);
/* панели могут менять размер сцены без изменения окна (появился график, строка статуса) */
new ResizeObserver(() => resize()).observe($('#stage'));
new ResizeObserver(() => { if (lastChart && chartbox.style.display !== 'none') chart(...lastChart); }).observe(chartbox);

function makeScene(fov=45, near=0.01, far=1e5){
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(fov, 1, near, far);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  return {scene, camera, controls};
}
function starfield(scene, n=4000, r=5000){
  const g = new THREE.BufferGeometry(), p = new Float32Array(n*3);
  for (let i=0;i<n;i++){ const u=Math.random()*2-1, t=Math.random()*6.283, s=Math.sqrt(1-u*u); p.set([r*s*Math.cos(t), r*u, r*s*Math.sin(t)], i*3); }
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  // звёзды разного цвета и яркости, а не одинаковые точки
  const col = new Float32Array(n*3), tint = [[.75,.82,1],[1,1,1],[1,.93,.8],[1,.8,.65]];
  for (let i=0;i<n;i++){ const t = tint[Math.random()*tint.length|0], b = .25+Math.pow(Math.random(),3)*.95; col.set([t[0]*b,t[1]*b,t[2]*b], i*3); }
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({vertexColors:true, size:1.5, sizeAttenuation:false, depthWrite:false, fog:false})); scene.add(pts); return pts;
}
/* подпись объекта: всегда одного размера на экране и читается поверх сцены */
function labelSprite(text){
  const c = document.createElement('canvas'), g = c.getContext('2d'), f = '500 32px -apple-system,Segoe UI,sans-serif'; g.font = f; const w = Math.ceil(g.measureText(text).width)+24; c.width = w; c.height = 46;
  const g2 = c.getContext('2d'); g2.font = f; g2.fillStyle = 'rgba(10,14,21,.72)'; g2.beginPath(); g2.roundRect(0,0,w,46,8); g2.fill(); g2.fillStyle = '#edf1f7'; g2.textBaseline = 'middle'; g2.fillText(text,12,24);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:t, sizeAttenuation:false, depthTest:false, transparent:true})); const h = .026; sp.scale.set(h*w/46, h, 1); sp.center.set(-.08,.5); sp.renderOrder = 5; return sp;
}
const RU_BODY = {sun:'Солнце', mercury:'Меркурий', venus:'Венера', earth:'Земля', moon:'Луна', mars:'Марс', jupiter:'Юпитер'};

// ------------------------------------------------------------ графики
let lastChart = null;
function chart(series, o={}){
  const css = getComputedStyle(document.documentElement), col = k => css.getPropertyValue(k).trim();
  chartbox.style.display = 'block'; lastChart = [series, o];
  // размер берём из раскладки: график тянется вместе с панелью и остаётся чётким на любом экране
  const dpr = devicePixelRatio || 1, W = chartEl.clientWidth || 460, H = chartEl.clientHeight || 200, c = chartEl.getContext('2d');
  if (chartEl.width !== Math.round(W*dpr) || chartEl.height !== Math.round(H*dpr)){ chartEl.width = Math.round(W*dpr); chartEl.height = Math.round(H*dpr); }
  c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
  const L=62,R=16,T=44,B=30;
  const tx = v => o.logx ? Math.log10(v) : v, ty = v => o.logy ? Math.log10(v) : v;
  let xs=[], ys=[];
  for (const s of series) for (let i=0;i<s.x.length;i++){ const X=tx(s.x[i]), Y=ty(s.y[i]); if (isFinite(X)&&isFinite(Y)){ xs.push(X); ys.push(Y);} }
  if (!xs.length) return;
  let [x0,x1] = o.xr ? o.xr.map(tx) : [Math.min(...xs), Math.max(...xs)], [y0,y1] = o.yr ? o.yr.map(ty) : [Math.min(...ys), Math.max(...ys)];
  if (y1===y0){ y1+=1; y0-=1; } if (x1===x0){ x1+=1; x0-=1; }
  const pad=(y1-y0)*0.06; if (!o.yr){ y0-=pad; y1+=pad; }
  const X = v => L+(tx(v)-x0)/(x1-x0)*(W-L-R), Y = v => H-B-(ty(v)-y0)/(y1-y0)*(H-T-B);
  c.strokeStyle=col('--line'); c.fillStyle=col('--muted'); c.font='12px -apple-system,Segoe UI,sans-serif'; c.lineWidth=1;
  for (let k=0;k<=4;k++){ const yy=T+k*(H-T-B)/4; c.beginPath(); c.moveTo(L,yy); c.lineTo(W-R,yy); c.stroke();
    const v=y1-(y1-y0)*k/4; c.fillText(o.logy? '1e'+v.toFixed(1) : fmt(v, Math.abs(v)<10?2:0), 4, yy+3); }
  for (let k=0;k<=4;k++){ const v=x0+(x1-x0)*k/4, xx=L+k*(W-L-R)/4; c.fillText(o.logx? '1e'+v.toFixed(1) : fmt(v, Math.abs(v)<10?2:0), xx-12, H-B+13); }
  c.fillStyle=col('--text'); c.font='600 13px -apple-system,Segoe UI,sans-serif'; c.fillText(o.title||'', L, 15); c.font='12px -apple-system,Segoe UI,sans-serif';
  c.fillStyle=col('--muted'); c.fillText(o.xlabel||'', W-R-c.measureText(o.xlabel||'').width, H-3);
  let lx = L; // легенда отдельной строкой под заголовком: длинный заголовок на неё не наезжает

    c.strokeStyle = c.fillStyle = s.color || '#6fb7ff'; c.lineWidth = s.width||1.6;
    if (s.dots){ for (let i=0;i<s.x.length;i++){ const xx=X(s.x[i]), yy=Y(s.y[i]); if(isFinite(xx)&&isFinite(yy)) c.fillRect(xx-1,yy-1,s.dot||2,s.dot||2);} }
    else { c.beginPath(); let st=false; for (let i=0;i<s.x.length;i++){ const xx=X(s.x[i]), yy=Y(s.y[i]); if(!isFinite(xx)||!isFinite(yy)) continue; st? c.lineTo(xx,yy) : c.moveTo(xx,yy); st=true; } if(s.dash) c.setLineDash([4,3]); c.stroke(); c.setLineDash([]); }
    if (s.label){ c.fillRect(lx, 28, 12, 3); c.fillStyle=col('--soft'); c.fillText(s.label, lx+16, 34); lx += 22 + c.measureText(s.label).width; }
  }
  if (o.marker!=null){ c.strokeStyle='#ffc361'; c.beginPath(); c.moveTo(X(o.marker),T); c.lineTo(X(o.marker),H-B); c.stroke(); }
}

function bbColor(t){ // быстрая аппроксимация цвета чёрного тела (для тысяч звёзд)
  t = Math.min(Math.max(t,1000),40000)/100; let r,g,b;
  r = t<=66 ? 255 : 329.698727446*Math.pow(t-60,-0.1332047592);
  g = t<=66 ? 99.4708025861*Math.log(t)-161.1195681661 : 288.1221695283*Math.pow(t-60,-0.0755148492);
  b = t>=66 ? 255 : t<=19 ? 0 : 138.5177312231*Math.log(t-10)-305.0447927307;
  return [r,g,b].map(v=>Math.min(Math.max(v,0),255)/255);
}
function tempColor(T, lo=200, hi=320){ // «turbo»-подобная шкала
  const x = Math.min(Math.max((T-lo)/(hi-lo),0),1);
  const st=[[0.19,0.07,0.23],[0.27,0.46,0.92],[0.15,0.85,0.75],[0.64,0.99,0.24],[0.98,0.73,0.22],[0.85,0.25,0.06],[0.48,0.02,0.01]];
  const f=x*(st.length-1), i=Math.min(Math.floor(f),st.length-2), w=f-i;
  return st[i].map((v,k)=>v*(1-w)+st[i+1][k]*w);
}

const NOISE = `

vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);

    fragmentShader: NOISE + `
      uniform vec3 uLow,uHigh,uSun; uniform float uOcean,uGas,uUseTemp,uIceT,uTlo,uThi,uSeed,uMap,uAmb; uniform sampler2D uTemp;
      varying vec3 vP; varying vec3 vN; varying vec3 vW;

function atmosphereShell(radius, color, strength){

    uniforms:{c:{value:new THREE.Color(...color)}, s:{value:strength}},
    vertexShader:`varying vec3 n; varying vec3 v; void main(){ n=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.); v=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform vec3 c; uniform float s; varying vec3 n; varying vec3 v; void main(){ float f=pow(1.-abs(dot(n,v)),2.2); gl_FragColor=vec4(c*f*s,f*s); }`});

// цвет поверхности из химического состава
function surfaceColors(w){
  const ox = Object.fromEntries(w.surface.oxides); const fe=(ox.FeO||0), al=(ox.Al2O3||0)+(ox.CaO||0), ti=(ox.TiO2||0);
  const oxidized = w.atmosphere && w.atmosphere.composition.some(([g,x])=>g==='CO2'&&x>.5) && w.physics==='mars' || w.surface.name==='mars';
  let low, high;
  if (oxidized){ low=[.42+fe*.4,.17+fe*.1,.08]; high=[.78,.47,.28]; }
  else { const gray=.25+al*.9-ti*1.5-fe*.6; low=[gray*.75,gray*.73,gray*.72]; high=[gray*1.35+.05,gray*1.33+.05,gray*1.3+.05]; }
  if (w.surface.name==='earth'){ low=[.16,.3,.12]; high=[.55,.48,.33]; }
  if (w.surface.name==='venus'){ low=[.55,.42,.22]; high=[.86,.72,.45]; }
  return [low.map(v=>Math.min(Math.max(v,0),1)), high.map(v=>Math.min(Math.max(v,0),1))];
}
function atmoColor(w){
  if (!w.atmosphere) return null;
  const comp = Object.fromEntries(w.atmosphere.composition), col = Math.log10(1+w.atmosphere.column_kg_m2);
  if ((comp.H2||0) > .5) return [[.85,.75,.6], .9];
  if ((comp.CO2||0) > .5) return w.atmosphere.pressure > 1e5 ? [[1,.85,.5], 1.6] : [[.9,.6,.4], .5+col*.1];
  return [[.35,.6,1], Math.min(.3+col*.25, 2.0)];
}

        <div>Год</div><div>${fmt(r.year_days,1)} сут</div><div>Перенос D</div><div>${fmt(r.D,3)} Вт/(м²·К)</div><div>Теплоёмкость</div><div>${fmt(r.C,2)} Дж/(м²·К)</div>
        <div>Невязка энергии</div><div>${fmt(r.residual,1)}</div><div>Дисбаланс TOA</div><div>${fmt(r.imbalance,3)} Вт/м²</div></div>
        <div class="muted" style="margin-top:6px">Шкала: ${fmt(lo,0)}–${fmt(hi,0)} К. Попробуйте снизить светимость до 85% с холодным стартом — гистерезис Будыко.</div>`;
      this.setFrame(0);

  },
  setFrame(k){
    const r = this.r; if (!r) return; const row = r.temp[k % r.temp.length], d = this.tex.image.data;
    for (let j=0;j<row.length;j++) d[j*4] = row[j]; this.tex.needsUpdate = true;
    const t = r.time[k % r.time.length];
    hud.style.display='block'; hud.innerHTML = `<span class="k">день года</span> <b>${Math.round(t*r.year_days)}</b> / ${Math.round(r.year_days)} <span class="k">· глоб. T</span> <b>${fmt(row.reduce((a,b)=>a+b,0)/row.length,1)} К</b>`;

      {title:'Температура (К) по широте', xlabel:'широта, °', yr:[Math.min(...r.temp.flat())-5, Math.max(...r.temp.flat())+5]});
  },
  update(dt){ if (this.mesh){ this.mesh.rotation.y += dt*0.1; this.acc += dt; if (this.acc > 0.12){ this.acc=0; this.frame++; this.setFrame(this.frame); } } },
};

// ============================================================ N тел (общая логика для солнечной и сгенерированных систем)
function nbodyView(S, meta, opts){
  const bodies = meta.bodies.map((b,i) => {
    const r = b.star ? 0.06 : Math.max(0.012, 0.0075*Math.log10(1+b.radius_km/400)*3);
    const col = new THREE.Color(b.color);
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 24), b.star ? new THREE.MeshBasicMaterial({color:col}) : new THREE.MeshStandardMaterial({color:col, roughness:.72, map: b.name==='jupiter' ? bandTex() : null}));
    S.scene.add(mesh);
    mesh.add(labelSprite(RU_BODY[b.name] || b.name));
    if (b.star){ const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(), color:col, blending:THREE.AdditiveBlending, depthWrite:false})); sp.scale.set(.6,.6,1); mesh.add(sp);
      const l = new THREE.PointLight(0xffffff, 3, 0, 0); mesh.add(l); }
    const tg = new THREE.BufferGeometry(); const N = opts?.trail || 1500; tg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3),3)); tg.setDrawRange(0,0);
    const trail = new THREE.Line(tg, new THREE.LineBasicMaterial({color:col, transparent:true, opacity:.45})); S.scene.add(trail);
    return {mesh, trail, n:0, N, star:b.star, name:b.name};
  });
  S.scene.add(new THREE.AmbientLight(0x404a60, .6));
  return bodies;
}
let _glow = null;
function glowTex(){ if (_glow) return _glow; const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.2,'rgba(255,255,255,.5)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); return _glow = new THREE.CanvasTexture(c); }
function scalePos(x,y,z, mode){ // эклиптика → сцена (y вверх)
  if (mode === 'sqrt'){ const r = Math.hypot(x,y,z) || 1e-12, s = Math.sqrt(r)/r; return [x*s, z*s, -y*s]; }
  return [x, z, -y];
}

      b.trail.geometry.setDrawRange(0,b.n); b.trail.geometry.attributes.position.needsUpdate = true;

      const e=1, x=st.pos[0], y=st.pos[1], n=new THREE.Vector3(-(this.heightAt(x+e,y)-this.heightAt(x-e,y))/(2*e),1,(this.heightAt(x,y+e)-this.heightAt(x,y-e))/(2*e)).normalize(), hd=st.state[st.state_names.indexOf('heading')], f=new THREE.Vector3(Math.cos(hd),0,-Math.sin(hd)); f.addScaledVector(n,-f.dot(n)).normalize(); const z=new THREE.Vector3().crossVectors(f,n);
      this.body.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(f,n,z));
      this.speed = st.speed;
    } else this.body.quaternion.set(q[1],q[3],-q[2],q[0]);
    this.throttle = this.task==='lander' && !st.done ? (st.action?.[0]||0) : this.task==='drone' && !st.done ? (st.action||[]).reduce((a,b)=>a+b,0)/4 : 0;
    this.alt = this.task==='lander' ? p.y-this.heightAt(st.pos[0],st.pos[1])-1.6 : 1e9;
    this.controls.target.add(d); this.camera.position.add(d);
    // тень считается вокруг аппарата
    const sz = {lander:40, drone:12, rover:16}[this.task], cam = this.sun.shadow.camera, el = this.task==='rover' ? st.state[st.state_names.indexOf('sun_elev')] : .75;
    if (cam.right !== sz){ cam.left=-sz; cam.right=sz; cam.top=sz; cam.bottom=-sz; cam.near=1; cam.far=800; cam.updateProjectionMatrix(); }
    this.sun.target.position.copy(p); this.sun.position.copy(p).add(new THREE.Vector3(.6*Math.cos(el),Math.sin(el),.8*Math.cos(el)).multiplyScalar(400));
    const seg = st.lidar.flatMap(l => [l[0],l[2],-l[1],l[3],l[5],-l[4]]);
    this.rays.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(seg),3));
    if (!this.trailPts.length || this.trailPts.at(-1).distanceTo(p)>.3){ this.trailPts.push(p); if (this.trailPts.length>900) this.trailPts.shift(); this.trail.geometry.setFromPoints(this.trailPts); }

    $('#r_info').innerHTML = st.done ? `<span class="pill ${i.success?'g':'r'}">${i.success?'Успех':'Отказ'}</span> ${esc(i.reason)}` : esc(st.text);
    const h = this.hist, gz = this.meta.params[this.meta.param_names.indexOf('goal_z')]; h.t.push(i.t); h.a.push(sv('z')-gz); h.v.push(v);

    if (this.frame % 8 === 1) this.camFrame();
  },
  async camFrame(){
    try {
      const r = await api(`/api/env/camera?id=${this.id}&w=96&h=64&mode=rgb`, {binary:true}), b = new Uint8Array(await r.arrayBuffer()), c = $('#r_cam')?.getContext('2d');
      if (!c) return; const im = c.createImageData(96,64); for (let i=0;i<96*64;i++){ im.data[i*4]=b[i*3]; im.data[i*4+1]=b[i*3+1]; im.data[i*4+2]=b[i*3+2]; im.data[i*4+3]=255; } c.putImageData(im,0,0);

  async loop(ep, my){
    while (ep === epoch && my === this.run){

        await api(`/api/env/step?id=${this.id}&mode=${$('#r_m').value}&repeat=${$('#r_s').value}`);
        const st = await api('/api/env/state?id='+this.id);

  update(dt){
    const b = this.body; if (!b) return;

    let any=false; for (let k=0;k<D.N;k++){ if (D.life[k]<=0) continue; any=true; D.life[k]-=dt; if (D.life[k]<=0){ a.setXYZ(k,1e6,1e6,1e6); continue; } a.setXYZ(k,a.getX(k)+D.vel[k*3]*dt,a.getY(k)+D.vel[k*3+1]*dt,a.getZ(k)+D.vel[k*3+2]*dt); }

  },
  dispose(){ this.run = (this.run||0)+1; if (this.id){ api('/api/env/close?id='+this.id).catch(()=>{}); this.id=null; } clearTimeout(this.deb); this.release(); this.dust?.pts.geometry.dispose(); this.dust?.pts.material.dispose(); this.ground=this.body=this.goal=this.rays=this.trail=this.rocks=this.plume=this.dust=null; },
};

/* форма параметров по реестру: группы раскрываются, пустое поле значит значение по умолчанию */
function paramForm(el, schema, task, vals, onchange, openGroups=[]){
  const defs = schema.filter(d => d.tasks.includes(task)), groups = [...new Set(defs.map(d=>d.group))];
  const changed = g => defs.filter(d=>d.group===g && vals[d.name]!==undefined).length;
  el.innerHTML = groups.map(g => `<details class="pg" ${openGroups.includes(g)?'open':''}><summary>${esc(g)} <span class="badge" data-b="${esc(g)}">${changed(g)||''}</span></summary>${defs.filter(d=>d.group===g).map(d=>`<div class="row pr" title="${esc(d.help)}"><label for="p_${d.name}">${esc(d.label)}${d.unit?`, <span class="muted">${esc(d.unit)}</span>`:''}</label><input id="p_${d.name}" data-p="${d.name}" type="number" min="${d.min}" max="${d.max}" step="any" value="${vals[d.name]??''}" placeholder="${d.defaults[task]}"></div>`).join('')}</details>`).join('');
  el.querySelectorAll('input[data-p]').forEach(i => i.onchange = () => {
    const d = defs.find(x=>x.name===i.dataset.p), v = i.value.trim();
    if (v === ''){ delete vals[d.name]; i.setCustomValidity(''); }
    else {
      const x = Number(v);
      if (!isFinite(x) || x < d.min || x > d.max){ i.setCustomValidity(`От ${d.min} до ${d.max}`); i.reportValidity(); return; }
      i.setCustomValidity('');
      if (x === d.defaults[task]) delete vals[d.name]; else vals[d.name] = x;
    }
    const b = el.querySelector(`[data-b="${CSS.escape(d.group)}"]`); if (b) b.textContent = changed(d.group)||'';
    onchange();
  });
}

  nozzle:{label:'Химия: сопло и Isp', fields:[['gamma','Показатель адиабаты',1.2,1.1,1.4,.01],['tc','Температура в камере, К',3600,1500,4000,50],['molar','Молярная масса, г/моль',13.5,2,40,.5]]},
  crater:{label:'Удары: кратер', fields:[['d','Диаметр тела, м',50,1,20000,1],['v','Скорость, км/с',13,1,70,1],['angle','Угол, °',45,5,90,5],['g','Гравитация, м/с²',9.81,.5,25,.01]]},
  collide:{label:'Удары: столкновение планет', fields:[['m1','Масса мишени, M⊕',1,.01,20,.01],['m2','Масса снаряда, M⊕',.1,.001,20,.001],['v','Скорость, км/с',12,1,80,1]]},
  ocean:{label:'Тектоника: дно океана', fields:[]},
};
const labTab = {
  async init(){
    $('main').classList.add('plot');
    panel.innerHTML = `<h2>Лаборатория</h2><div class="muted">Квантовые эффекты, газ и вода, химия, удары, тектоника. Везде показана и модель, и точный ответ, когда он есть.</div>
      <div class="row"><label>Опыт</label><select id="l_t">${Object.entries(LAB_TOPICS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></div><div id="l_f"></div><h3>Результат</h3><div id="l_r" class="kv"></div><div id="l_n" class="muted" style="margin-top:10px"></div>`;
    $('#l_t').onchange = () => this.topic();
    this.topic();
  },
  topic(){
    const t = LAB_TOPICS[$('#l_t').value];
    $('#l_f').innerHTML = t.fields.map(([k,l,d,mn,mx,st])=>`<div class="row"><label>${l}</label><input data-k="${k}" type="number" value="${d}" min="${mn}" max="${mx}" step="${st}"></div>`).join('');
    $('#l_f').querySelectorAll('input').forEach(i => i.onchange = () => this.run());
    this.run();
  },
  vals(){ const o = {}; $('#l_f').querySelectorAll('input').forEach(i => o[i.dataset.k]=i.value); return o; },
  async run(){
    const my = this.req = (this.req||0)+1, id = $('#l_t').value, P = (k,v) => `<div>${k}</div><div>${v}</div>`, res = h => $('#l_r').innerHTML = h, note = h => $('#l_n').innerHTML = h;
    cancelAnimationFrame(this.raf);
    try {
      const r = await api(`/api/lab/${id}?`+qs(this.vals()));
      if (my !== this.req) return;
      note('');
      if (id==='tunnel'){
        res(P('Прохождение, точно', fmt(r.t_exact,4))+P('Прохождение, волновой пакет', fmt(r.t_numeric,4))+P('Норма в конце', fmt(r.norm,6)));
        note('Классическая частица с энергией ниже барьера не прошла бы вообще.');
        let f=0, last=0; const scale=Math.max(...r.frames[0]); const loop=(ts)=>{ if (my!==this.req) return; if (ts-last>60){ last=ts; chart([{x:r.x,y:r.frames[f],color:'#5aa2ff',label:'|ψ|²'},{x:r.x,y:r.v.map(v=>v/Math.max(...r.v,1e-9)*scale),color:'#fbbf4b',label:'барьер'}],{title:`Волновой пакет, кадр ${f+1} из ${r.frames.length}`,xlabel:'x, а.е.',yr:[0,scale*1.1]}); f=(f+1)%r.frames.length; } this.raf=requestAnimationFrame(loop); }; this.raf=requestAnimationFrame(loop);
      } else if (id==='levels'){
        res(r.rows.map(a=>P(esc(a.name), `${fmt(a.value,4)} <span class="muted">/ ${fmt(a.exact,4)}</span>`)).join('')); note('Слева численное решение уравнения Шрёдингера, справа точный ответ. Атомные единицы.');
        chart(r.series.map((s,i)=>({x:s.n,y:s.e,dots:true,dot:7,color:['#5aa2ff','#fbbf4b'][i],label:s.name})),{title:'Уровни энергии',xlabel:'номер уровня'});
      } else if (id==='hydrogen'){
        res(r.lines.map(l=>P(esc(l.name), fmt(l.nm,2)+' нм')).join('')); note('Вакуумные длины волн, модель Бора с приведённой массой.');
        chart([{x:r.levels.map(l=>l.n),y:r.levels.map(l=>l.ev),dots:true,dot:7,color:'#5aa2ff',label:'E, эВ'}],{title:'Уровни атома водорода',xlabel:'n'});
      } else if (id==='sod'){
        res(P('Ошибка L1 плотности', fmt(r.l1,5))+P('Ошибка массы', r.mass_error.toExponential(1)));
        chart([{x:r.x,y:r.exact,color:'#fbbf4b',label:'точно'},{x:r.x,y:r.rho,color:'#5aa2ff',label:'расчёт'}],{title:'Плотность газа',xlabel:'x'});
      } else if (id==='dam'){
        res(P('Ошибка глубины', fmt(r.err*100,2)+'%')+P('Скорость фронта, теория', fmt(r.front,2)+' м/с'));
        chart([{x:r.x,y:r.exact,color:'#fbbf4b',label:'Риттер'},{x:r.x,y:r.h,color:'#5aa2ff',label:'расчёт'}],{title:'Глубина воды, м',xlabel:'x, м'});
      } else if (id==='chapman'){
        res(P('O₃/O₂ в конце', r.ratio.toExponential(3))+P('O₃/O₂ стационарно', r.steady.toExponential(3))+P('Ошибка по атомам', r.atoms.toExponential(1))); note('Типичные учебные коэффициенты для стратосферы, это не прогноз озона.');
        chart([{x:r.t,y:r.o3,color:'#5aa2ff',label:'O₃, 1/см³'}],{title:'Накопление озона',xlabel:'часы'});
      } else if (id==='nozzle'){
        res(P('Isp на уровне среза 1 атм', fmt(r.isp_sl,1)+' с')+P('Скорость истечения в пределе', fmt(r.ve_vac,0)+' м/с')); note('Идеальное сопло, без потерь. Результат можно подставить в параметр isp на вкладке Mission Lab.');
        chart([{x:r.ratio,y:r.isp,color:'#5aa2ff',label:'Isp, с'}],{title:'Импульс от степени расширения',xlabel:'площадь среза / критического сечения',logx:true});
      } else if (id==='crater'){
        res(P('Переходный кратер', fmt(r.transient/1e3,2)+' км')+P('Итоговый кратер', fmt(r.final/1e3,2)+' км')+P('Энергия удара', r.energy_mt.toExponential(2)+' Мт')); note('Масштабная оценка по Коллинзу и др. (2005), железное тело и скальная мишень.');
        chart([{x:r.ds,y:r.fs,color:'#5aa2ff',label:'диаметр кратера, км'}],{title:'Кратер от размера тела',xlabel:'диаметр тела, м',logx:true,logy:true});
      } else if (id==='collide'){
        res(P('Удельная энергия', r.q.toExponential(2)+' Дж/кг')+P('Порог разрушения', r.q_star.toExponential(2)+' Дж/кг')+P('Масса остатка', fmt(r.remnant*100,1)+'%')+P('Исход', esc(r.outcome)));
        chart([{x:r.vs,y:r.fr,color:'#5aa2ff',label:'доля массы в остатке'}],{title:'Остаток от скорости удара',xlabel:'скорость, км/с',yr:[0,1]});
      } else if (id==='ocean'){
        res(P('Опускание, м·√млн лет', fmt(r.slope,0))+P('Поток в плите 80 млн лет', fmt(r.q80,1)+' мВт/м²')+P('Число Рэлея мантии', r.ra.toExponential(2))+P('Скорость конвекции', fmt(r.speed,1)+' см/год')); note('Оценки по порядку величины: остывающая плита и пограничный слой, а не движение реальных плит.');
        chart([{x:r.age,y:r.depth,color:'#5aa2ff',label:'глубина дна, м'}],{title:'Глубина океана от возраста плиты',xlabel:'млн лет'});
      }
    } catch(e){ if (my===this.req) note(`<span class="no">${esc(e.message)}</span>`); }
  },
  update(){},
  dispose(){ $('main').classList.remove('plot'); this.req=(this.req||0)+1; cancelAnimationFrame(this.raf); },
};

const tabs = {settings:settingsTab, blackhole:blackholeTab, lab:labTab, mission:missionTab, robots:robotsTab, world:worldTab, climate:climateTab, solar:solarTab, system:systemTab, starmap:starmapTab, galaxy:galaxyTab, cosmo:cosmoTab, laws:lawsTab};
let initChain = Promise.resolve(), intro = null;
async function switchTab(name){
  const my = ++epoch;
  const veil = $('#veil');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
  if (current && !REDUCED){ veil.classList.add('on'); await sleep(170); }
  await initChain;              // предыдущая вкладка могла ещё грузиться: не даём ей писать в чужую панель
  if (my !== epoch) return;     // пока шёл переход, выбрали другую вкладку
  if (current){ current.dispose?.(); current.controls?.dispose(); current.scene?.traverse(o=>{ o.geometry?.dispose?.(); }); }
  hud.style.display='none'; chartbox.style.display='none'; panel.style.display=''; panel.innerHTML=''; panel.classList.remove('enter'); lastChart = null;
  current = tabs[name]; if (location.hash !== '#'+name) location.hash = name; intro = null;
  initChain = (async () => { try { await current.init(); } catch(e){ panel.innerHTML = `<div class="no">Ошибка: ${esc(e.message)}</div>`; console.error(e); } })();
  await initChain;
  if (my !== epoch) return;
  resize();
  void panel.offsetWidth; panel.classList.add('enter');
  // плавный наезд камеры; любое движение мышью его отменяет
  if (current.camera && current.controls && !current.noIntro && !REDUCED){
    const c = current.camera, t = current.controls.target, to = c.position.clone();
    intro = {c, from: to.clone().sub(t).multiplyScalar(1.5).add(t), to, t0: performance.now()};
    c.position.copy(intro.from);
    current.controls.addEventListener('start', () => { intro = null; }, {once:true});
  }
  veil.classList.remove('on');
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .1);
  if (intro && current?.camera === intro.c){
    const k = Math.min((performance.now()-intro.t0)/900, 1), e = 1-Math.pow(1-k,3);
    intro.c.position.lerpVectors(intro.from, intro.to, e);
    if (k >= 1) intro = null;
  }
  if (current?.scene){ current.controls.update(); current.update(dt); renderer.render(current.scene, current.camera); }
  else { renderer.clear(); }
});
applySettings();
/* клавиши 1–9: быстрый переход между вкладками */
addEventListener('keydown', e => { if (e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; const b = document.querySelectorAll('nav button')[+e.key-1]; if (b && /[1-9]/.test(e.key)) switchTab(b.dataset.tab); });
addEventListener('hashchange', () => { const t = location.hash.slice(1); if (t in tabs && current !== tabs[t]) switchTab(t); });
resize();
switchTab((location.hash||'#world').slice(1) in tabs ? (location.hash||'#world').slice(1) : 'world');
</script>
