<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>worldsim — модель вселенной</title>
<style>
:root{--bg:#05070d;--panel:rgba(14,18,30,.86);--line:#232b40;--text:#dfe6f3;--muted:#8792a8;--accent:#6fb7ff;--good:#5fd38d;--bad:#ff6b6b;--warn:#ffc361}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:200px 1fr;height:100%}
nav{background:#080b14;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:4px;overflow:auto}
nav h1{font-size:16px;margin:0 6px 2px;letter-spacing:.3px}nav .sub{color:var(--muted);font-size:11px;margin:0 6px 12px}
nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:8px;color:var(--muted);display:flex;gap:10px;align-items:center}
nav button:hover{background:#121a2c;color:var(--text)}nav button.on{background:#14223b;color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
nav .foot{margin-top:auto;color:var(--muted);font-size:11px;padding:8px 6px;line-height:1.5}
main{position:relative;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{position:absolute;top:12px;right:12px;width:340px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{margin:0 0 4px;font-size:15px}.panel h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.hud{position:absolute;left:12px;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums;min-width:200px}
.hud b{color:#fff}.hud .k{color:var(--muted)}
.chartbox{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row label{flex:0 0 120px;color:var(--muted)}.row>*:last-child{flex:1}
select,input[type=number],input[type=text]{background:#0b1120;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;font:inherit}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{all:unset;cursor:pointer;background:#1b2b4a;color:#fff;padding:7px 12px;border-radius:7px;text-align:center;font-weight:600}
.btn:hover{background:#25406e}.btn.sec{background:#151d2e;color:var(--text);font-weight:500}.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}.kv div:nth-child(odd){color:var(--muted)}.kv div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;background:#1a2438;color:var(--muted)}.pill.g{background:#123222;color:var(--good)}.pill.r{background:#3a1717;color:var(--bad)}
.muted{color:var(--muted)}.ok{color:var(--good)}.no{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:#1a2236;overflow:hidden;margin-top:2px}.bar i{display:block;height:100%;background:var(--accent)}
#laws{position:absolute;inset:0;overflow:auto;padding:24px 28px;display:none}#laws table td{font-size:12px}
#tip{position:absolute;pointer-events:none;background:#0b1120ee;border:1px solid var(--line);padding:6px 8px;border-radius:6px;display:none;font-size:12px}
#busy{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#14223b;padding:6px 12px;border-radius:999px;display:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
<nav>
  <h1>🌌 worldsim</h1><div class="sub">модель вселенной · законы проверяются</div>
  <button data-tab="world">🪐 Миры</button>
  <button data-tab="climate">🌡️ Климат</button>
  <button data-tab="solar">☀️ Солнечная система</button>
  <button data-tab="system">✨ Звёздные системы</button>
  <button data-tab="starmap">🔭 Карта звёзд и экзопланет</button>
  <button data-tab="galaxy">🌀 Галактики</button>
  <button data-tab="cosmo">🕸️ Космология</button>
  <button data-tab="laws">✅ Законы</button>
  <div class="foot">Данные: HYG v4.1 (CC BY-SA 4.0), Open Exoplanet Catalogue (MIT), Planck 2018, NASA Fact Sheets.<br>Мышь: вращение, колесо — масштаб.</div>
</nav>
<main>
  <canvas id="gl"></canvas>
  <div id="hud" class="hud" style="display:none"></div>
  <div id="panel" class="panel"></div>
  <div id="chartbox" class="chartbox" style="display:none"><canvas id="chart" width="460" height="230"></canvas></div>
  <div id="laws"></div>
  <div id="tip"></div>
  <div id="busy">считаю…</div>
</main>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================ инфраструктура
const $ = s => document.querySelector(s);
const canvas = $('#gl'), panel = $('#panel'), hud = $('#hud'), chartbox = $('#chartbox'), chartEl = $('#chart'), tip = $('#tip');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
let current = null, epoch = 0;
const api = async (path, opts={}) => {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).error } catch(e){} throw new Error(m); }
  return opts.binary ? r : r.json();
};
const qs = o => new URLSearchParams(Object.entries(o).filter(([k,v]) => v !== undefined && v !== null && v !== '')).toString();
const busy = on => $('#busy').style.display = on ? 'block' : 'none';
const fmt = (x, d=2) => x == null || !isFinite(x) ? '—' : (Math.abs(x) >= 1e5 || (Math.abs(x) < 1e-3 && x !== 0)) ? x.toExponential(d) : x.toFixed(d);
function resize(){ const m = canvas.parentElement; renderer.setSize(m.clientWidth, m.clientHeight, false); if (current?.camera){ current.camera.aspect = m.clientWidth/m.clientHeight; current.camera.updateProjectionMatrix(); } }
addEventListener('resize', resize);

function makeScene(fov=45, near=0.01, far=1e5){
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(fov, 1, near, far);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  return {scene, camera, controls};
}
function starfield(scene, n=4000, r=5000){
  const g = new THREE.BufferGeometry(), p = new Float32Array(n*3);
  for (let i=0;i<n;i++){ const u=Math.random()*2-1, t=Math.random()*6.283, s=Math.sqrt(1-u*u); p.set([r*s*Math.cos(t), r*u, r*s*Math.sin(t)], i*3); }
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0x8899bb, size:1.2, sizeAttenuation:false})));
}

// ------------------------------------------------------------ графики
function chart(series, o={}){
  chartbox.style.display = 'block';
  const W = chartEl.width, H = chartEl.height, c = chartEl.getContext('2d');
  c.clearRect(0,0,W,H);
  const L=52,R=10,T=22,B=30;
  const tx = v => o.logx ? Math.log10(v) : v, ty = v => o.logy ? Math.log10(v) : v;
  let xs=[], ys=[];
  for (const s of series) for (let i=0;i<s.x.length;i++){ const X=tx(s.x[i]), Y=ty(s.y[i]); if (isFinite(X)&&isFinite(Y)){ xs.push(X); ys.push(Y);} }
  if (!xs.length) return;
  let [x0,x1] = o.xr ? o.xr.map(tx) : [Math.min(...xs), Math.max(...xs)], [y0,y1] = o.yr ? o.yr.map(ty) : [Math.min(...ys), Math.max(...ys)];
  if (y1===y0){ y1+=1; y0-=1; } if (x1===x0){ x1+=1; x0-=1; }
  const pad=(y1-y0)*0.06; if (!o.yr){ y0-=pad; y1+=pad; }
  const X = v => L+(tx(v)-x0)/(x1-x0)*(W-L-R), Y = v => H-B-(ty(v)-y0)/(y1-y0)*(H-T-B);
  c.strokeStyle='#2a3350'; c.fillStyle='#8792a8'; c.font='10px sans-serif'; c.lineWidth=1;
  for (let k=0;k<=4;k++){ const yy=T+k*(H-T-B)/4; c.beginPath(); c.moveTo(L,yy); c.lineTo(W-R,yy); c.stroke();
    const v=y1-(y1-y0)*k/4; c.fillText(o.logy? '1e'+v.toFixed(1) : fmt(v, Math.abs(v)<10?2:0), 4, yy+3); }
  for (let k=0;k<=4;k++){ const v=x0+(x1-x0)*k/4, xx=L+k*(W-L-R)/4; c.fillText(o.logx? '1e'+v.toFixed(1) : fmt(v, Math.abs(v)<10?2:0), xx-12, H-B+13); }
  c.fillStyle='#dfe6f3'; c.font='11px sans-serif'; c.fillText(o.title||'', L, 13);
  c.fillStyle='#8792a8'; c.fillText(o.xlabel||'', W-R-c.measureText(o.xlabel||'').width, H-3);
  let lx = L+6;
  for (const s of series){
    c.strokeStyle = c.fillStyle = s.color || '#6fb7ff'; c.lineWidth = s.width||1.6;
    if (s.dots){ for (let i=0;i<s.x.length;i++){ const xx=X(s.x[i]), yy=Y(s.y[i]); if(isFinite(xx)&&isFinite(yy)) c.fillRect(xx-1,yy-1,s.dot||2,s.dot||2);} }
    else { c.beginPath(); let st=false; for (let i=0;i<s.x.length;i++){ const xx=X(s.x[i]), yy=Y(s.y[i]); if(!isFinite(xx)||!isFinite(yy)) continue; st? c.lineTo(xx,yy) : c.moveTo(xx,yy); st=true; } if(s.dash) c.setLineDash([4,3]); c.stroke(); c.setLineDash([]); }
    if (s.label){ c.fillRect(lx, T+4, 10, 3); c.fillStyle='#dfe6f3'; c.fillText(s.label, lx+13, T+9); lx += 22 + c.measureText(s.label).width; }
  }
  if (o.marker!=null){ c.strokeStyle='#ffc361'; c.beginPath(); c.moveTo(X(o.marker),T); c.lineTo(X(o.marker),H-B); c.stroke(); }
}

// ------------------------------------------------------------ цвета
function bbColor(t){ // быстрая аппроксимация цвета чёрного тела (для тысяч звёзд)
  t = Math.min(Math.max(t,1000),40000)/100; let r,g,b;
  r = t<=66 ? 255 : 329.698727446*Math.pow(t-60,-0.1332047592);
  g = t<=66 ? 99.4708025861*Math.log(t)-161.1195681661 : 288.1221695283*Math.pow(t-60,-0.0755148492);
  b = t>=66 ? 255 : t<=19 ? 0 : 138.5177312231*Math.log(t-10)-305.0447927307;
  return [r,g,b].map(v=>Math.min(Math.max(v,0),255)/255);
}
function tempColor(T, lo=200, hi=320){ // «turbo»-подобная шкала
  const x = Math.min(Math.max((T-lo)/(hi-lo),0),1);
  const st=[[0.19,0.07,0.23],[0.27,0.46,0.92],[0.15,0.85,0.75],[0.64,0.99,0.24],[0.98,0.73,0.22],[0.85,0.25,0.06],[0.48,0.02,0.01]];
  const f=x*(st.length-1), i=Math.min(Math.floor(f),st.length-2), w=f-i;
  return st[i].map((v,k)=>v*(1-w)+st[i+1][k]*w);
}

// ------------------------------------------------------------ шейдер планеты
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 perm(vec4 x){return mod289(((x*34.)+1.)*x);}vec4 tis(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
i=mod289(i);vec4 p=perm(perm(perm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);
vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
vec4 norm=tis(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}
float fbm(vec3 p){float s=0.,a=.5;for(int i=0;i<6;i++){s+=a*snoise(p);p*=2.03;a*=.5;}return s;}`;
function planetMaterial(u){
  return new THREE.ShaderMaterial({
    uniforms: Object.assign({uLow:{value:new THREE.Color(.3,.3,.3)}, uHigh:{value:new THREE.Color(.6,.6,.6)}, uOcean:{value:0}, uGas:{value:0},
      uSun:{value:new THREE.Vector3(1,.3,.6).normalize()}, uTemp:{value:null}, uUseTemp:{value:0}, uIceT:{value:0}, uTlo:{value:200}, uThi:{value:320}, uSeed:{value:1}, uMap:{value:0}}, u),
    vertexShader:`varying vec3 vP; varying vec3 vN; varying vec3 vW; void main(){ vP=position; vN=normalize(normalMatrix*normal); vW=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.);}`,
    fragmentShader: NOISE + `
      uniform vec3 uLow,uHigh,uSun; uniform float uOcean,uGas,uUseTemp,uIceT,uTlo,uThi,uSeed,uMap; uniform sampler2D uTemp;
      varying vec3 vP; varying vec3 vN; varying vec3 vW;
      vec3 turbo(float x){x=clamp(x,0.,1.);vec3 a=vec3(.19,.07,.23),b=vec3(.27,.46,.92),c=vec3(.15,.85,.75),d=vec3(.64,.99,.24),e=vec3(.98,.73,.22),f=vec3(.85,.25,.06),g=vec3(.48,.02,.01);
        float s=x*6.;if(s<1.)return mix(a,b,s);if(s<2.)return mix(b,c,s-1.);if(s<3.)return mix(c,d,s-2.);if(s<4.)return mix(d,e,s-3.);if(s<5.)return mix(e,f,s-4.);return mix(f,g,s-5.);}
      void main(){
        vec3 p=normalize(vP); float lat=asin(clamp(p.y,-1.,1.)); vec3 col;
        float h=fbm(p*2.2+uSeed)*.6+fbm(p*9.+uSeed*2.)*.25;
        if(uGas>.5){ float band=sin(lat*14.+fbm(p*vec3(2.,10.,2.)+uSeed)*2.2); col=mix(uLow,uHigh,.5+.5*band); col*=.85+.15*snoise(p*30.); }
        else{
          float crater=smoothstep(.55,.62,abs(snoise(p*18.+uSeed)))*.15;
          col=mix(uLow,uHigh,smoothstep(-.5,.6,h))-crater;
          if(uOcean>0.){ float sea=uOcean*1.2-.6; if(h<sea) col=mix(vec3(.02,.08,.22),vec3(.05,.25,.45),smoothstep(sea-.5,sea,h)); }
        }
        float T=0.;
        if(uUseTemp>.5){ T=texture2D(uTemp,vec2(.5,(lat/3.14159265)+.5)).r;
          if(uMap>.5){ col=mix(col,turbo((T-uTlo)/(uThi-uTlo)),.82); }
          if(uIceT>0. && T<uIceT+fbm(p*6.)*3.) col=mix(col,vec3(.92,.95,1.),.9);
        }
        float diff=max(dot(normalize(vN),normalize((viewMatrix*vec4(uSun,0.)).xyz)),0.);
        gl_FragColor=vec4(col*(.08+1.05*diff),1.);
      }`
  });
}
function atmosphereShell(radius, color, strength){
  const m = new THREE.ShaderMaterial({ transparent:true, blending:THREE.AdditiveBlending, side:THREE.BackSide, depthWrite:false,
    uniforms:{c:{value:new THREE.Color(...color)}, s:{value:strength}},
    vertexShader:`varying vec3 n; varying vec3 v; void main(){ n=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.); v=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform vec3 c; uniform float s; varying vec3 n; varying vec3 v; void main(){ float f=pow(1.-abs(dot(n,v)),2.2); gl_FragColor=vec4(c*f*s,f*s); }`});
  return new THREE.Mesh(new THREE.SphereGeometry(radius*1.06, 64, 32), m);
}
// цвет поверхности из химического состава
function surfaceColors(w){
  const ox = Object.fromEntries(w.surface.oxides); const fe=(ox.FeO||0), al=(ox.Al2O3||0)+(ox.CaO||0), ti=(ox.TiO2||0);
  const oxidized = w.atmosphere && w.atmosphere.composition.some(([g,x])=>g==='CO2'&&x>.5) && w.physics==='mars' || w.surface.name==='mars';
  let low, high;
  if (oxidized){ low=[.42+fe*.4,.17+fe*.1,.08]; high=[.78,.47,.28]; }
  else { const gray=.25+al*.9-ti*1.5-fe*.6; low=[gray*.75,gray*.73,gray*.72]; high=[gray*1.35+.05,gray*1.33+.05,gray*1.3+.05]; }
  if (w.surface.name==='earth'){ low=[.16,.3,.12]; high=[.55,.48,.33]; }
  if (w.surface.name==='venus'){ low=[.55,.42,.22]; high=[.86,.72,.45]; }
  return [low.map(v=>Math.min(Math.max(v,0),1)), high.map(v=>Math.min(Math.max(v,0),1))];
}
function atmoColor(w){
  if (!w.atmosphere) return null;
  const comp = Object.fromEntries(w.atmosphere.composition), col = Math.log10(1+w.atmosphere.column_kg_m2);
  if ((comp.H2||0) > .5) return [[.85,.75,.6], .9];
  if ((comp.CO2||0) > .5) return w.atmosphere.pressure > 1e5 ? [[1,.85,.5], 1.6] : [[.9,.6,.4], .5+col*.1];
  return [[.35,.6,1], Math.min(.3+col*.25, 2.0)];
}

// ============================================================ вкладка: Миры
const worldTab = {
  async init(){
    const S = makeScene(40); Object.assign(this, S); starfield(S.scene);
    this.camera.position.set(0,0.6,3.2);
    this.group = new THREE.Group(); S.scene.add(this.group);
    const pr = this.presets = await api('/api/presets');
    const opt = (arr, sel, extra=[]) => extra.concat(arr).map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('');
    panel.innerHTML = `<h2>Конструктор мира</h2><div class="muted">Смешивайте физику, атмосферу и состав разных тел — величины пересчитываются из законов.</div>
      <div class="row"><label>Физика тела</label><select id="w_phys">${opt(pr.physics,'earth')}</select></div>
      <div class="row"><label>Атмосфера</label><select id="w_atm">${opt(pr.atmosphere,'auto',['auto'])}</select></div>
      <div class="row"><label>Поверхность</label><select id="w_srf">${opt(pr.surface,'auto',['auto'])}</select></div>
      <div class="row"><label>Масштаб g</label><input id="w_g" type="range" min="0.2" max="3" step="0.05" value="1"></div>
      <div class="row"><label>Расстояние, а.е.</label><input id="w_d" type="text" placeholder="по орбите"></div>
      <div class="btns"><span class="btn" id="w_go">Построить</span><span class="btn sec" id="w_cl">Климат этого мира →</span></div>
      <div id="w_info"></div>
      <h3>Бросок / запуск</h3>
      <div class="row"><label>Скорость, м/с</label><input id="t_v" type="number" value="300"></div>
      <div class="row"><label>Угол, °</label><input id="t_e" type="number" value="45"></div>
      <div class="row"><label>Широта, °</label><input id="t_lat" type="number" value="30"></div>
      <div class="row"><label>Сопротивление</label><select id="t_drag"><option value="1">да</option><option value="0">вакуум</option></select></div>
      <div class="btns"><span class="btn" id="t_go">Запустить</span><span class="btn sec" id="t_orb">Почти орбитальная скорость</span></div>
      <div id="t_info" class="muted"></div>`;

// ============================================================ N тел (общая логика для солнечной и сгенерированных систем)
function nbodyView(S, meta, opts){
  const bodies = meta.bodies.map((b,i) => {
    const r = b.star ? 0.06 : Math.max(0.012, 0.0075*Math.log10(1+b.radius_km/400)*3);
    const col = new THREE.Color(b.color);
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 16), b.star ? new THREE.MeshBasicMaterial({color:col}) : new THREE.MeshStandardMaterial({color:col, roughness:.8}));
    S.scene.add(mesh);
    if (b.star){ const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(), color:col, blending:THREE.AdditiveBlending, depthWrite:false})); sp.scale.set(.6,.6,1); mesh.add(sp);
      const l = new THREE.PointLight(0xffffff, 3, 0, 0); mesh.add(l); }
    const tg = new THREE.BufferGeometry(); const N = 1500; tg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3),3)); tg.setDrawRange(0,0);
    const trail = new THREE.Line(tg, new THREE.LineBasicMaterial({color:col, transparent:true, opacity:.45})); S.scene.add(trail);
    return {mesh, trail, n:0, N, star:b.star, name:b.name};
  });
  S.scene.add(new THREE.AmbientLight(0x404a60, .6));
  return bodies;
}
let _glow = null;
function glowTex(){ if (_glow) return _glow; const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.2,'rgba(255,255,255,.5)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); return _glow = new THREE.CanvasTexture(c); }
function scalePos(x,y,z, mode){ // эклиптика → сцена (y вверх)
  if (mode === 'sqrt'){ const r = Math.hypot(x,y,z) || 1e-12, s = Math.sqrt(r)/r; return [x*s, z*s, -y*s]; }
  return [x, z, -y];
}

      if (this.paused){ await new Promise(r=>setTimeout(r,100)); continue; }

        const r = await api('/api/nbody/step?' + qs({id:this.id, days:$('#s_v').value, dt_hours:2}));

      const p = scalePos(x,y,z,mode); b.mesh.position.set(...p);

    this.showing = 'pk';
    const r = await api('/api/cosmo/power?id=' + this.id);
    chart([{x:r.k, y:r.p, color:'#ffc361', label:'измерено в симуляции'}, {x:r.k, y:r.p_lin, color:'#6fb7ff', label:'линейная теория × D²', dash:true}],
      {title:`Спектр мощности P(k), (Мпк/h)³ при a = ${r.a.toFixed(3)}`, logx:true, logy:true, xlabel:'k, h/Мпк'});
    $('#k_info').innerHTML = 'На больших масштабах (малые k) рост идёт по линейной теории; на малых — нелинейное усиление: образуются гало и нити.';
  },
  update(){},
};
function interp(xs, ys, x){ for (let i=1;i<xs.length;i++) if (xs[i]>=x){ const w=(x-xs[i-1])/(xs[i]-xs[i-1]); return ys[i-1]*(1-w)+ys[i]*w; } return ys[ys.length-1]; }

// ============================================================ вкладка: Законы
const lawsTab = {
  async init(){
    const el = $('#laws'); el.style.display='block'; panel.style.display='none';
    el.innerHTML = '<h2>Проверка законов</h2><div class="muted">Каждая строка — независимый тест: симуляция против закона сохранения, аналитики или наблюдений. Считается заново прямо сейчас…</div>';
    const t0 = performance.now(); const r = await api('/api/validate'); const ok = r.filter(c=>c.pass).length;
    el.innerHTML = `<h2>Проверка законов: <span class="${ok===r.length?'ok':'no'}">${ok} / ${r.length}</span> <span class="muted" style="font-size:12px">за ${((performance.now()-t0)/1000).toFixed(1)} с</span></h2>
      <table><tr><th></th><th>Закон</th><th>Тест</th><th>Получено</th><th>Ожидалось</th></tr>${r.map(c=>`<tr><td class="${c.pass?'ok':'no'}">${c.pass?'✔':'✘'}</td><td>${c.law}</td><td>${c.test}</td><td><b>${c.value}</b></td><td class="muted">${c.expected}</td></tr>`).join('')}</table>`;
  },
  update(){},
  dispose(){ $('#laws').style.display='none'; panel.style.display='block'; },
};

// ============================================================ переключение и цикл
const tabs = {world:worldTab, climate:climateTab, solar:solarTab, system:systemTab, starmap:starmapTab, galaxy:galaxyTab, cosmo:cosmoTab, laws:lawsTab};
async function switchTab(name){
  epoch++;
  if (current){ current.dispose?.(); current.controls?.dispose(); current.scene?.traverse(o=>{ o.geometry?.dispose?.(); }); }
  hud.style.display='none'; chartbox.style.display='none'; panel.style.display='block'; panel.innerHTML='';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
  current = tabs[name]; location.hash = name;
  try { await current.init(); } catch(e){ panel.innerHTML = `<div class="no">Ошибка: ${e.message}</div>`; console.error(e); }
  resize();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .1);
  if (current?.scene){ current.controls.update(); current.update(dt); renderer.render(current.scene, current.camera); }
  else { renderer.clear(); }
});
resize();
switchTab((location.hash||'#world').slice(1) in tabs ? (location.hash||'#world').slice(1) : 'world');
</script>
