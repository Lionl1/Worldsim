<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>worldsim — модель вселенной</title>
<style>
:root{--bg:#05070d;--panel:rgba(14,18,30,.86);--line:#232b40;--text:#dfe6f3;--muted:#8792a8;--accent:#6fb7ff;--good:#5fd38d;--bad:#ff6b6b;--warn:#ffc361}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:200px 1fr;height:100%}
nav{background:#080b14;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:4px;overflow:auto}
nav h1{font-size:16px;margin:0 6px 2px;letter-spacing:.3px}nav .sub{color:var(--muted);font-size:11px;margin:0 6px 12px}
nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:8px;color:var(--muted);display:flex;gap:10px;align-items:center}
nav button:hover{background:#121a2c;color:var(--text)}nav button.on{background:#14223b;color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
nav .foot{margin-top:auto;color:var(--muted);font-size:11px;padding:8px 6px;line-height:1.5}
main{position:relative;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{position:absolute;top:12px;right:12px;width:340px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{margin:0 0 4px;font-size:15px}.panel h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.hud{position:absolute;left:12px;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums;min-width:200px}
.hud b{color:#fff}.hud .k{color:var(--muted)}
.chartbox{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row label{flex:0 0 120px;color:var(--muted)}.row>*:last-child{flex:1}
select,input[type=number],input[type=text]{background:#0b1120;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;font:inherit}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{all:unset;cursor:pointer;background:#1b2b4a;color:#fff;padding:7px 12px;border-radius:7px;text-align:center;font-weight:600}
.btn:hover{background:#25406e}.btn.sec{background:#151d2e;color:var(--text);font-weight:500}.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}.kv div:nth-child(odd){color:var(--muted)}.kv div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;background:#1a2438;color:var(--muted)}.pill.g{background:#123222;color:var(--good)}.pill.r{background:#3a1717;color:var(--bad)}
.muted{color:var(--muted)}.ok{color:var(--good)}.no{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:#1a2236;overflow:hidden;margin-top:2px}.bar i{display:block;height:100%;background:var(--accent)}
#laws{position:absolute;inset:0;overflow:auto;padding:24px 28px;display:none}#laws table td{font-size:12px}
#tip{position:absolute;pointer-events:none;background:#0b1120ee;border:1px solid var(--line);padding:6px 8px;border-radius:6px;display:none;font-size:12px}
#busy{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#14223b;padding:6px 12px;border-radius:999px;display:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* движение и глубина */
#gl{transition:opacity .28s ease}#veil{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,#0a1020 0%,#05070d 75%);transition:opacity .2s ease;z-index:6}#veil.on{opacity:1}
nav button{transition:background .18s ease,color .18s ease,box-shadow .22s ease,transform .18s ease}nav button:hover{transform:translateX(2px)}nav button:active{transform:translateX(2px) scale(.98)}
nav .grp{color:#5d6880;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;margin:10px 10px 2px}
nav button.on{background:linear-gradient(90deg,#17305a,#101c33);box-shadow:inset 3px 0 0 var(--accent),0 0 18px rgba(111,183,255,.12)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}
.panel.enter{animation:rise .36s cubic-bezier(.2,.8,.2,1) both}.chartbox.enter{animation:rise .42s .05s cubic-bezier(.2,.8,.2,1) both}.hud{animation:pop .3s ease both}
.panel,.hud,.chartbox{box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}.btn{transition:background .16s ease,transform .1s ease,box-shadow .16s ease}.btn:hover{box-shadow:0 0 0 1px rgba(111,183,255,.35)}.btn:active{transform:translateY(1px)}.btn.off{opacity:.5;pointer-events:none}
input[type=range]{transition:filter .15s}input[type=range]:hover{filter:brightness(1.2)}select,input[type=number],input[type=text],textarea{transition:border-color .15s,box-shadow .15s}select:focus,input:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px rgba(111,183,255,.18)}
#busy{display:flex;align-items:center;gap:8px;opacity:0;visibility:hidden;transition:opacity .15s;z-index:8;box-shadow:0 6px 24px rgba(0,0,0,.4)}#busy.on{opacity:1;visibility:visible}#busy::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);animation:spin .7s linear infinite}
.cam{width:100%;image-rendering:pixelated;border-radius:6px;border:1px solid var(--line);background:#000;display:block}
.pill.y{background:#3a2f12;color:var(--warn)}
/* Mission Lab */
#mission{position:absolute;inset:0;overflow:auto;padding:22px 26px 30px;display:none;background:radial-gradient(1200px 600px at 80% -10%,#13203c 0%,transparent 60%)}.ml-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px;animation:rise .35s both}.ml-head h2{margin:0 0 3px;font-size:21px}.ml-head .muted{max-width:680px}
.ml-grid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:14px;align-items:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:0 8px 30px rgba(0,0,0,.3);animation:rise .4s cubic-bezier(.2,.8,.2,1) both}.card h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.ml-editor{position:sticky;top:0}.ml-editor textarea{width:100%;height:calc(100vh - 170px);min-height:320px;background:#0b1120;color:#cfe0ff;border:1px solid var(--line);border-radius:8px;padding:9px;font:12px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
.ml-res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ml-res>.card:nth-child(2){animation-delay:.05s}.ml-res>.card:nth-child(3){animation-delay:.1s}.ml-res>.card:nth-child(4){animation-delay:.15s}.ml-res>.card:nth-child(5){animation-delay:.2s}.ml-wide,.hero,.ml-res>.card:nth-child(2){grid-column:1/-1}.ml-empty{grid-column:1/-1;text-align:center;padding:60px 20px;display:flex;flex-direction:column;gap:6px;align-items:center}.ml-big{font-size:42px}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:4px 16px;align-items:center}.hero.good{border-color:#23553b;background:linear-gradient(120deg,rgba(40,110,75,.28),var(--panel) 55%)}.hero.bad{border-color:#5c2c33;background:linear-gradient(120deg,rgba(130,45,55,.26),var(--panel) 55%)}.ml-num{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}.ml-advice{grid-column:1/-1;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.hbar{display:grid;grid-template-columns:minmax(120px,42%) 1fr 48px;gap:8px;align-items:center;margin:5px 0;font-size:12px}.hbar b{text-align:right;font-variant-numeric:tabular-nums}.hbar .bar{height:8px}.bar i.red,.tor i.red{background:linear-gradient(90deg,#c9535f,#ff6b6b)}.tor{position:relative;height:9px;background:#1a2236;border-radius:3px;overflow:hidden}.tor::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#54607c}.tor i{position:absolute;top:0;bottom:0;display:block;animation:grow .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}.tor i.grn{background:linear-gradient(90deg,#3f9e6c,#5fd38d)}.tor u{position:absolute;top:3px;height:3px;background:rgba(255,255,255,.55);z-index:1}.tor.ci{margin-bottom:3px}@keyframes grow{from{opacity:.2;transform:scaleX(.2)}to{opacity:1;transform:none}}tr.dim td{color:var(--muted)}.ml-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
@media (max-width:1100px){.ml-grid{grid-template-columns:minmax(0,1fr)}.ml-editor{position:static}.ml-editor textarea{height:240px;min-height:0}}
@media (max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}nav{flex-direction:row;padding:6px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:2px;scrollbar-width:none}nav h1,nav .sub,nav .foot,nav .grp{display:none}nav button{white-space:nowrap;padding:8px 10px;flex:0 0 auto}nav button:hover{transform:none}nav button.on{box-shadow:inset 0 -2px 0 var(--accent)}
.panel{top:auto;left:0;right:0;bottom:0;width:100%;max-height:46%;border-radius:14px 14px 0 0;border-width:1px 0 0}.chartbox{display:none!important}.hud{left:8px;right:8px;top:8px;font-size:12px}#laws,#mission{padding:14px}#laws table{font-size:11px}.ml-grid,.ml-res{grid-template-columns:minmax(0,1fr)}.ml-editor{position:static}.ml-editor textarea{height:220px;min-height:0}.hero{grid-template-columns:auto 1fr}.ml-count{grid-column:1/-1}.card{overflow-x:auto}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<div id="app">
<nav>
  <h1>🌌 worldsim</h1><div class="sub">физика для миссий и world models</div>
  <div class="grp">Инженерия</div>
  <button data-tab="mission">🚀 Mission Lab</button>
  <button data-tab="robots">🤖 Роботы</button>
  <button data-tab="laws">✅ Законы</button>
  <div class="grp">Вселенная</div>
  <button data-tab="world">🪐 Миры</button>
  <button data-tab="climate">🌡️ Климат</button>
  <button data-tab="solar">☀️ Солнечная система</button>
  <button data-tab="system">✨ Звёздные системы</button>
  <button data-tab="starmap">🔭 Карта звёзд и экзопланет</button>
  <button data-tab="galaxy">🌀 Галактики</button>
  <button data-tab="cosmo">🕸️ Космология</button>
  <div class="foot">Данные: HYG v4.1 (CC BY-SA 4.0), Open Exoplanet Catalogue (MIT), Planck 2018, NASA Fact Sheets.<br>Мышь: вращение, колесо — масштаб.</div>
</nav>
<main>
  <canvas id="gl"></canvas>
  <div id="hud" class="hud" style="display:none"></div>
  <div id="panel" class="panel"></div>
  <div id="chartbox" class="chartbox" style="display:none"><canvas id="chart" width="460" height="230"></canvas></div>
  <div id="laws"></div>
  <div id="mission"></div>
  <div id="veil"></div>
  <div id="tip"></div>
  <div id="busy"><span id="busy_t">считаю…</span></div>
</main>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================ инфраструктура
const $ = s => document.querySelector(s);
const canvas = $('#gl'), panel = $('#panel'), hud = $('#hud'), chartbox = $('#chartbox'), chartEl = $('#chart'), tip = $('#tip');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
let current = null, epoch = 0;
const api = async (path, opts={}) => {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).error } catch(e){} throw new Error(m); }
  return opts.binary ? r : r.json();
};
const qs = o => new URLSearchParams(Object.entries(o).filter(([k,v]) => v !== undefined && v !== null && v !== '')).toString();
const busy = (on, text='считаю…') => { $('#busy_t').textContent = text; $('#busy').classList.toggle('on', !!on); };
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
/* время в подходящих единицах: млрд лет … лет */
const fmtTime = g => { const a=Math.abs(g); return a>=1 ? g.toFixed(3)+' млрд лет' : a>=1e-3 ? (g*1e3).toFixed(2)+' млн лет' : a>=1e-6 ? (g*1e6).toFixed(1)+' тыс. лет' : (g*1e9).toFixed(0)+' лет'; };
const fmt = (x, d=2) => x == null || !isFinite(x) ? '—' : (Math.abs(x) >= 1e5 || (Math.abs(x) < 1e-3 && x !== 0)) ? x.toExponential(d) : x.toFixed(d);
function resize(){ const m = canvas.parentElement; renderer.setSize(m.clientWidth, m.clientHeight, false); if (current?.camera){ current.camera.aspect = m.clientWidth/m.clientHeight; current.camera.updateProjectionMatrix(); } }
addEventListener('resize', resize);

function makeScene(fov=45, near=0.01, far=1e5){
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(fov, 1, near, far);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  return {scene, camera, controls};
}
function starfield(scene, n=4000, r=5000){
  const g = new THREE.BufferGeometry(), p = new Float32Array(n*3);
  for (let i=0;i<n;i++){ const u=Math.random()*2-1, t=Math.random()*6.283, s=Math.sqrt(1-u*u); p.set([r*s*Math.cos(t), r*u, r*s*Math.sin(t)], i*3); }
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0x8899bb, size:1.2, sizeAttenuation:false})));
}

// ------------------------------------------------------------ графики
function chart(series, o={}){
  chartbox.style.display = 'block';
  const W = chartEl.width, H = chartEl.height, c = chartEl.getContext('2d');
  c.clearRect(0,0,W,H);
  const L=52,R=10,T=22,B=30;
  const tx = v => o.logx ? Math.log10(v) : v, ty = v => o.logy ? Math.log10(v) : v;
  let xs=[], ys=[];
  for (const s of series) for (let i=0;i<s.x.length;i++){ const X=tx(s.x[i]), Y=ty(s.y[i]); if (isFinite(X)&&isFinite(Y)){ xs.push(X); ys.push(Y);} }
  if (!xs.length) return;
  let [x0,x1] = o.xr ? o.xr.map(tx) : [Math.min(...xs), Math.max(...xs)], [y0,y1] = o.yr ? o.yr.map(ty) : [Math.min(...ys), Math.max(...ys)];
  if (y1===y0){ y1+=1; y0-=1; } if (x1===x0){ x1+=1; x0-=1; }
  const pad=(y1-y0)*0.06; if (!o.yr){ y0-=pad; y1+=pad; }
  const X = v => L+(tx(v)-x0)/(x1-x0)*(W-L-R), Y = v => H-B-(ty(v)-y0)/(y1-y0)*(H-T-B);
  c.strokeStyle='#2a3350'; c.fillStyle='#8792a8'; c.font='10px sans-serif'; c.lineWidth=1;
  for (let k=0;k<=4;k++){ const yy=T+k*(H-T-B)/4; c.beginPath(); c.moveTo(L,yy); c.lineTo(W-R,yy); c.stroke();
    const v=y1-(y1-y0)*k/4; c.fillText(o.logy? '1e'+v.toFixed(1) : fmt(v, Math.abs(v)<10?2:0), 4, yy+3); }
  for (let k=0;k<=4;k++){ const v=x0+(x1-x0)*k/4, xx=L+k*(W-L-R)/4; c.fillText(o.logx? '1e'+v.toFixed(1) : fmt(v, Math.abs(v)<10?2:0), xx-12, H-B+13); }
  c.fillStyle='#dfe6f3'; c.font='11px sans-serif'; c.fillText(o.title||'', L, 13);
  c.fillStyle='#8792a8'; c.fillText(o.xlabel||'', W-R-c.measureText(o.xlabel||'').width, H-3);
  let lx = L+6;
  for (const s of series){
    c.strokeStyle = c.fillStyle = s.color || '#6fb7ff'; c.lineWidth = s.width||1.6;
    if (s.dots){ for (let i=0;i<s.x.length;i++){ const xx=X(s.x[i]), yy=Y(s.y[i]); if(isFinite(xx)&&isFinite(yy)) c.fillRect(xx-1,yy-1,s.dot||2,s.dot||2);} }
    else { c.beginPath(); let st=false; for (let i=0;i<s.x.length;i++){ const xx=X(s.x[i]), yy=Y(s.y[i]); if(!isFinite(xx)||!isFinite(yy)) continue; st? c.lineTo(xx,yy) : c.moveTo(xx,yy); st=true; } if(s.dash) c.setLineDash([4,3]); c.stroke(); c.setLineDash([]); }
    if (s.label){ c.fillRect(lx, T+4, 10, 3); c.fillStyle='#dfe6f3'; c.fillText(s.label, lx+13, T+9); lx += 22 + c.measureText(s.label).width; }
  }
  if (o.marker!=null){ c.strokeStyle='#ffc361'; c.beginPath(); c.moveTo(X(o.marker),T); c.lineTo(X(o.marker),H-B); c.stroke(); }
}

// ------------------------------------------------------------ цвета
function bbColor(t){ // быстрая аппроксимация цвета чёрного тела (для тысяч звёзд)
  t = Math.min(Math.max(t,1000),40000)/100; let r,g,b;
  r = t<=66 ? 255 : 329.698727446*Math.pow(t-60,-0.1332047592);
  g = t<=66 ? 99.4708025861*Math.log(t)-161.1195681661 : 288.1221695283*Math.pow(t-60,-0.0755148492);
  b = t>=66 ? 255 : t<=19 ? 0 : 138.5177312231*Math.log(t-10)-305.0447927307;
  return [r,g,b].map(v=>Math.min(Math.max(v,0),255)/255);
}
function tempColor(T, lo=200, hi=320){ // «turbo»-подобная шкала
  const x = Math.min(Math.max((T-lo)/(hi-lo),0),1);
  const st=[[0.19,0.07,0.23],[0.27,0.46,0.92],[0.15,0.85,0.75],[0.64,0.99,0.24],[0.98,0.73,0.22],[0.85,0.25,0.06],[0.48,0.02,0.01]];
  const f=x*(st.length-1), i=Math.min(Math.floor(f),st.length-2), w=f-i;
  return st[i].map((v,k)=>v*(1-w)+st[i+1][k]*w);
}

// ------------------------------------------------------------ шейдер планеты
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 perm(vec4 x){return mod289(((x*34.)+1.)*x);}vec4 tis(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
i=mod289(i);vec4 p=perm(perm(perm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);
vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);

    fragmentShader: NOISE + `

function atmosphereShell(radius, color, strength){

    vertexShader:`varying vec3 n; varying vec3 v; void main(){ n=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.); v=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform vec3 c; uniform float s; varying vec3 n; varying vec3 v; void main(){ float f=pow(1.-abs(dot(n,v)),2.2); gl_FragColor=vec4(c*f*s,f*s); }`});

// цвет поверхности из химического состава
function surfaceColors(w){
  const ox = Object.fromEntries(w.surface.oxides); const fe=(ox.FeO||0), al=(ox.Al2O3||0)+(ox.CaO||0), ti=(ox.TiO2||0);
  const oxidized = w.atmosphere && w.atmosphere.composition.some(([g,x])=>g==='CO2'&&x>.5) && w.physics==='mars' || w.surface.name==='mars';
  let low, high;
  if (oxidized){ low=[.42+fe*.4,.17+fe*.1,.08]; high=[.78,.47,.28]; }
  else { const gray=.25+al*.9-ti*1.5-fe*.6; low=[gray*.75,gray*.73,gray*.72]; high=[gray*1.35+.05,gray*1.33+.05,gray*1.3+.05]; }
  if (w.surface.name==='earth'){ low=[.16,.3,.12]; high=[.55,.48,.33]; }
  if (w.surface.name==='venus'){ low=[.55,.42,.22]; high=[.86,.72,.45]; }
  return [low.map(v=>Math.min(Math.max(v,0),1)), high.map(v=>Math.min(Math.max(v,0),1))];
}
function atmoColor(w){
  if (!w.atmosphere) return null;

  if ((comp.CO2||0) > .5) return w.atmosphere.pressure > 1e5 ? [[1,.85,.5], 1.6] : [[.9,.6,.4], .5+col*.1];
  return [[.35,.6,1], Math.min(.3+col*.25, 2.0)];
}

function nbodyView(S, meta, opts){
  const bodies = meta.bodies.map((b,i) => {
    const r = b.star ? 0.06 : Math.max(0.012, 0.0075*Math.log10(1+b.radius_km/400)*3);
    const col = new THREE.Color(b.color);

function scalePos(x,y,z, mode){ // эклиптика → сцена (y вверх)

    const v3 = p => new THREE.Vector3(p[0],p[2],-p[1]), p = v3(st.pos), d = p.clone().sub(this.controls.target);
    this.body.position.copy(p); const q = st.quat; this.body.quaternion.set(q[1],q[3],-q[2],q[0]);
    if (this.flame){ const th = (st.action?.[0]||0); this.flame.visible = th>.01 && !st.done; this.flame.scale.set(.5+th*.6, .4+th*3, .5+th*.6); this.flame.position.y = -.9-th*1.5; }
    this.controls.target.add(d); this.camera.position.add(d);
    const seg = st.lidar.flatMap(l => [l[0],l[2],-l[1],l[3],l[5],-l[4]]);
    this.rays.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(seg),3));
    if (!this.trailPts.length || this.trailPts.at(-1).distanceTo(p)>.5){ this.trailPts.push(p); if (this.trailPts.length>600) this.trailPts.shift(); this.trail.geometry.setFromPoints(this.trailPts); }
    const v = Math.hypot(...st.vel), i = st.info, sn = st.state_names, sv = k => st.state[sn.indexOf(k)];
    hud.style.display='block';
    hud.innerHTML = `<span class="k">t =</span> <b>${fmt(i.t,1)} с</b> <span class="k">· v =</span> <b>${fmt(v,2)} м/с</b> <span class="k">· шаг</span> ${i.steps} <span class="k">· награда</span> <b>${fmt(i.episode_return,1)}</b>`;
    $('#r_info').innerHTML = st.done ? `<span class="pill ${i.success?'g':'r'}">${i.success?'успех':'отказ'}</span> ${esc(i.reason)}` : `<div class="muted">${esc(st.text)}</div>`;
    const h = this.hist; h.t.push(i.t); h.a.push(sv('z')-this.meta.params[this.meta.param_names.indexOf('goal_z')]); h.v.push(v);
    if (h.t.length>800) for (const k of ['t','a','v']) h[k].shift();
    if (this.frame++ % 6 === 0) chart([{x:h.t, y:h.a, color:'#6fb7ff', label:'высота над целью, м'},{x:h.t, y:h.v.map(x=>x*5), color:'#ffc361', label:'скорость ×5, м/с'}], {title:'Истинное состояние', xlabel:'с'});
    if (this.frame % 8 === 1) this.camFrame();
  },
  async camFrame(){
    try {
      const r = await api(`/api/env/camera?id=${this.id}&w=96&h=64&mode=rgb`, {binary:true}), b = new Uint8Array(await r.arrayBuffer()), c = $('#r_cam')?.getContext('2d');
      if (!c) return; const im = c.createImageData(96,64); for (let i=0;i<96*64;i++){ im.data[i*4]=b[i*3]; im.data[i*4+1]=b[i*3+1]; im.data[i*4+2]=b[i*3+2]; im.data[i*4+3]=255; } c.putImageData(im,0,0);
    } catch(e){}
  },
  async loop(ep, my){
    while (ep === epoch && my === this.run){
      if (this.paused){ await new Promise(r=>setTimeout(r,120)); continue; }
      try {
        await api(`/api/env/step?id=${this.id}&mode=${$('#r_m').value}&repeat=${$('#r_s').value}`);
        const st = await api('/api/env/state?id='+this.id);
        if (ep !== epoch || my !== this.run) return;
        this.place(st);
        if (st.done){ await new Promise(r=>setTimeout(r,1800)); if (ep===epoch && my===this.run && !this.paused){ this.seed++; this.start(); } return; }
      } catch(e){ return; }
      // вровень с отрисовкой, но скрытая вкладка браузера не должна останавливать симуляцию
      await Promise.race([new Promise(r=>requestAnimationFrame(r)), sleep(50)]);
    }
  },
  update(){},
  dispose(){ this.run = (this.run||0)+1; if (this.id){ fetch('/api/env/close?id='+this.id).catch(()=>{}); this.id=null; } this.ground=this.body=this.goal=this.rays=this.trail=null; },
};

// ============================================================ вкладка: Mission Lab
const VERDICT = {'выполнено':'g','не выполнено':'r','данных мало':'y','нет данных':''};
const missionTab = {
  async init(){
    const el = $('#mission'); el.style.display='block'; panel.style.display='none';
    el.innerHTML = `<div class="ml-head"><div><h2>Mission Lab</h2><div class="muted">От требований миссии к инженерному ответу: выполнима ли она, что её ломает и какая технология окупится. Те же условия полёта для каждого варианта.</div></div>
        <div class="btns"><select id="ml_p" style="width:auto"><option value="lunar_lander">Лунный модуль</option><option value="mars_helicopter">Вертолёт на Марсе</option><option value="lunar_rover">Лунный ровер</option></select>
        <span class="btn" id="ml_go">Рассчитать миссию</span></div></div>
      <div class="ml-grid"><div class="card ml-editor"><h3>Описание миссии</h3><textarea id="ml_s" spellcheck="false"></textarea><div id="ml_err" class="no"></div></div>
      <div id="ml_res" class="ml-res"><div class="card ml-empty"><div class="ml-big">🚀</div><b>Нажмите «Рассчитать миссию»</b><div class="muted">Сотни полётов с разбросами параметров дадут карту требований, причины отказов и ценность технологий.</div></div></div></div>`;
    $('#ml_p').onchange = () => this.load();
    $('#ml_go').onclick = () => this.calc();
    await this.load();
  },
  async load(){ $('#ml_s').value = JSON.stringify(await api('/api/mission/example?name='+$('#ml_p').value), null, 2); },
  async calc(){
    const my = epoch; $('#ml_err').textContent=''; let spec;
    try { spec = JSON.stringify(JSON.parse($('#ml_s').value)); } catch(e){ $('#ml_err').textContent = 'Описание не разобрано: '+e.message; return; }
    busy(true, 'считаю полёты…'); $('#ml_go').classList.add('off');
    try {
      const r = await api('/api/mission/run', {method:'POST', body:spec});
      if (my === epoch){ this.r = r; this.show(r); }
    } catch(e){ if (my === epoch) $('#ml_err').textContent = e.message; }
    finally { busy(false); $('#ml_go')?.classList.remove('off'); }
  },
  show(r){
    const pct = x => isFinite(x) && x!=null ? (100*x).toFixed(1)+'%' : '—', num = x => x==null||!isFinite(x) ? '—' : fmt(x, Math.abs(x)<10?2:1);
    const met = r.requirements_met, tot = r.requirements_total, ok = met===tot;
    const tv = q => q.percentile==null ? pct : num;
    const techs = r.technologies, sig = techs.filter(t=>t.delta>t.delta_ci), best = sig[0], maxD = Math.max(.01,...techs.map(t=>Math.abs(t.delta)+t.delta_ci)), maxF = Math.max(.01,...r.drivers.map(d=>Math.abs(d.delta)));
    const advice = ok ? 'Все требования выполняются с запасом, проверенным по доверительным интервалам.' : best ? `Больше всего даёт «${esc(best.name)}»: ${(best.delta*100).toFixed(1)} п.п. успеха${best.dry_mass_delta>0?` за ${best.dry_mass_delta} кг`:''}. Требований после неё: ${best.requirements_met} из ${tot}.` : 'Ни одна из заданных технологий не даёт значимого улучшения: стоит пересмотреть варианты или требования.';
    $('#ml_res').innerHTML = `
      <div class="card hero ${ok?'good':'bad'}"><div class="ml-num">${pct(r.success)}</div><div><b>успешных полётов</b><div class="muted">95%: ${pct(r.success_ci[0])}–${pct(r.success_ci[1])} · ${r.runs} запусков · ${fmt(r.seconds,1)} с расчёта</div></div>
        <div class="ml-count"><span class="pill ${ok?'g':'r'}">требований ${met} из ${tot}</span></div><div class="ml-advice">${advice}</div></div>
      <div class="card"><h3>Требования</h3><table><tr><th>ID</th><th>Требование</th><th>Цель</th><th>Результат</th><th>95%</th><th></th></tr>${r.scorecard.map(q=>`<tr><td class="muted">${esc(q.id)}</td><td>${esc(q.text)}</td><td>${q.op} ${tv(q)(q.target)}</td><td><b>${tv(q)(q.value)}</b></td><td class="muted">${tv(q)(q.ci_low)}–${tv(q)(q.ci_high)}</td><td><span class="pill ${VERDICT[q.verdict]}">${q.verdict}</span></td></tr>`).join('')}</table></div>
      <div class="card"><h3>Как именно отказывает</h3>${r.failure_modes.length?r.failure_modes.map(f=>`<div class="hbar"><span>${esc(f.mode)}</span><div class="bar"><i class="red" style="width:${100*f.share}%"></i></div><b>${pct(f.share)}</b></div>`).join(''):'<div class="muted">Отказов нет.</div>'}</div>
      <div class="card"><h3>Что ломает миссию</h3><div class="muted" style="margin-bottom:6px">Каждый разброс включён отдельно. Без разбросов успех ${pct(r.baseline_no_dispersions)}.</div>${r.drivers.map(d=>`<div class="hbar"><span>${esc(d.name)} <i class="muted">σ ${d.sigma}</i></span><div class="tor"><i class="${d.delta<0?'red':'grn'}" style="width:${50*Math.abs(d.delta)/maxF}%;${d.delta<0?'right:50%':'left:50%'}"></i></div><b>${d.delta>=0?'+':''}${(100*d.delta).toFixed(1)}</b></div>`).join('')}</div>
      ${techs.length?`<div class="card ml-wide"><h3>Ценность технологий</h3><div class="muted" style="margin-bottom:6px">Парное сравнение на тех же условиях полёта. Жирным — значимо, интервал не включает ноль.</div><table><tr><th>Технология</th><th style="width:34%">Изменение успеха, п.п.</th><th>Спасено / потеряно</th><th>Масса</th><th>Требований</th></tr>${techs.map(t=>{const s=t.delta-t.delta_ci>0||t.delta+t.delta_ci<0;return `<tr class="${s?'':'dim'}"><td>${s?'<b>':''}${esc(t.name)}${s?'</b>':''}</td><td><div class="tor ci"><i class="${t.delta<0?'red':'grn'}" style="width:${50*Math.abs(t.delta)/maxD}%;${t.delta<0?'right:50%':'left:50%'}"></i><u style="left:${50+50*(t.delta-t.delta_ci)/maxD}%;width:${100*t.delta_ci/maxD}%"></u></div><span class="muted">${t.delta>=0?'+':''}${(100*t.delta).toFixed(1)} ± ${(100*t.delta_ci).toFixed(1)}</span></td><td>${t.saved} / ${t.lost}</td><td>${t.dry_mass_delta?`+${t.dry_mass_delta} кг`:'—'}</td><td>${t.requirements_met} из ${tot}</td></tr>`}).join('')}</table></div>`:''}
      <div class="card ml-wide ml-foot"><span class="muted">${esc(r.limits)} ${esc(r.generator)}, seed ${r.seed}.</span><div class="btns"><span class="btn sec" id="ml_md">Отчёт .md</span><span class="btn sec" id="ml_js">Данные .json</span></div></div>`;
    const dl = (txt, name, type) => { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); };
    $('#ml_md').onclick = () => dl(r.markdown, 'mission_report.md', 'text/markdown');
    $('#ml_js').onclick = () => dl(JSON.stringify(r,null,2), 'mission_report.json', 'application/json');
    $('#mission').scrollTo({top:0, behavior: REDUCED ? 'auto':'smooth'});
  },
  update(){},
  dispose(){ $('#mission').style.display='none'; panel.style.display='block'; },
};

const tabs = {mission:missionTab, robots:robotsTab, world:worldTab, climate:climateTab, solar:solarTab, system:systemTab, starmap:starmapTab, galaxy:galaxyTab, cosmo:cosmoTab, laws:lawsTab};
let initChain = Promise.resolve(), intro = null;
async function switchTab(name){
  const my = ++epoch;
  const veil = $('#veil');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
  if (current && !REDUCED){ veil.classList.add('on'); await sleep(170); }
  await initChain;              // предыдущая вкладка могла ещё грузиться: не даём ей писать в чужую панель
  if (my !== epoch) return;     // пока шёл переход, выбрали другую вкладку
  if (current){ current.dispose?.(); current.controls?.dispose(); current.scene?.traverse(o=>{ o.geometry?.dispose?.(); }); }
  hud.style.display='none'; chartbox.style.display='none'; panel.style.display='block'; panel.innerHTML=''; panel.classList.remove('enter'); chartbox.classList.remove('enter');
  current = tabs[name]; if (location.hash !== '#'+name) location.hash = name; intro = null;
  initChain = (async () => { try { await current.init(); } catch(e){ panel.innerHTML = `<div class="no">Ошибка: ${esc(e.message)}</div>`; console.error(e); } })();
  await initChain;
  if (my !== epoch) return;
  resize();
  void panel.offsetWidth; panel.classList.add('enter'); chartbox.classList.add('enter');
  // плавный наезд камеры; любое движение мышью его отменяет
  if (current.camera && current.controls && !current.noIntro && !REDUCED){
    const c = current.camera, t = current.controls.target, to = c.position.clone();
    intro = {c, from: to.clone().sub(t).multiplyScalar(1.5).add(t), to, t0: performance.now()};
    c.position.copy(intro.from);
    current.controls.addEventListener('start', () => { intro = null; }, {once:true});
  }
  veil.classList.remove('on');
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .1);
  if (intro && current?.camera === intro.c){
    const k = Math.min((performance.now()-intro.t0)/900, 1), e = 1-Math.pow(1-k,3);
    intro.c.position.lerpVectors(intro.from, intro.to, e);
    if (k >= 1) intro = null;
  }
  if (current?.scene){ current.controls.update(); current.update(dt); renderer.render(current.scene, current.camera); }
  else { renderer.clear(); }
});
/* клавиши 1–9: быстрый переход между вкладками */
addEventListener('keydown', e => { if (e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; const b = document.querySelectorAll('nav button')[+e.key-1]; if (b && /[1-9]/.test(e.key)) switchTab(b.dataset.tab); });
addEventListener('hashchange', () => { const t = location.hash.slice(1); if (t in tabs && current !== tabs[t]) switchTab(t); });
resize();
switchTab((location.hash||'#world').slice(1) in tabs ? (location.hash||'#world').slice(1) : 'world');
</script>
