name: Packages
# Builds the PyPI wheels (the Rust library inside, no compiler needed to install) and checks
# the crate on every change to the packaging. A tag vX.Y.Z publishes to PyPI (trusted
# publishing) and to crates.io (secret CARGO_REGISTRY_TOKEN).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["python/**", "Cargo.toml", "Cargo.lock", ".github/workflows/packages.yml"]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, container: "quay.io/pypa/manylinux_2_28_x86_64", plat: manylinux_2_28_x86_64, lib: libworldsim.so }
          - { os: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64", plat: manylinux_2_28_aarch64, lib: libworldsim.so }
          - { os: macos-latest, container: "", plat: macosx_11_0_arm64, lib: libworldsim.dylib }
          - { os: windows-latest, container: "", plat: win_amd64, lib: worldsim.dll }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust and Python in the manylinux image
        if: matrix.container != ''
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.container == ''
      - uses: actions/setup-python@v5
        if: matrix.container == ''
        with:
          python-version: "3.12"
      - run: cargo build --release --locked
      - name: Wheel with the library inside
        run: |
          cp "target/release/${{ matrix.lib }}" python/worldsim/
          cp README.md python/README.md
          python -m pip install wheel
          python -m pip wheel ./python --no-deps -w dist
          python -m wheel tags --python-tag py3 --abi-tag none --platform-tag "${{ matrix.plat }}" --remove dist/*.whl
      - name: The installed wheel runs without the checkout
        run: |
          python -m pip install dist/*.whl
          cd "${RUNNER_TEMP:-/tmp}"
          python - <<'PY'
          import numpy as np
          import worldsim.vec as vec
          assert "site-packages" in vec._find_lib(), vec._find_lib()
          env = vec.VectorEnv(task="lander", worlds="moon", n=2)
          env.reset()
          obs = env.step(np.zeros((2, env.act_dim), np.float32))[0]
          assert obs.shape == (2, env.obs_dim)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat }}
          path: dist/*.whl
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          cp README.md python/README.md
          python -m pip install build twine
          python -m build --sdist python -o dist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
  crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run --locked
      - name: The tag matches both versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate="v$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          py="v$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml)"
          test "$crate" = "${{ github.ref_name }}" && test "$py" = "${{ github.ref_name }}"
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, crate]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
  publish-crate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, crate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
