name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, bin: worldsim }
          - { os: macos-latest, name: macos-arm64, bin: worldsim }
          - { os: windows-latest, name: windows-x86_64, bin: worldsim.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Пакет
        shell: bash
        run: |
          mkdir dist
          cp target/release/${{ matrix.bin }} README.md LICENSE dist/
          cp -r missions dist/
          tar -czf worldsim-${{ github.ref_name }}-${{ matrix.name }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: worldsim-*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum worldsim-*.tar.gz > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" worldsim-*.tar.gz SHA256SUMS --repo "${{ github.repository }}" --generate-notes
