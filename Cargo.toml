[package]
name = "worldsim"
version = "0.3.2"
edition = "2021"
description = "Physical models of worlds (Earth, Moon, Mars, ...) for simulation and data generation"
license = "MIT"

[lib]
name = "worldsim"
path = "src/lib.rs"
# cdylib — for the vector environment in Python through ctypes (see python/worldsim/vec.py)
crate-type = ["rlib", "cdylib"]

[dependencies]
# intentionally empty: standard library only

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 3
